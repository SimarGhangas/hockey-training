<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Hockey Masters Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hockey Masters Trainer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0D12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12; --surface:#161B23; --surface2:#1D232C; --border:#262D38;
  --text:#F2F5F9; --text-dim:#94A0B1; --text-faint:#5C6675;
  --accent:#9C1C3B; --accent-dim:rgba(156,28,59,0.20); --accent-text:#FF6F85;
  --success:#22E584; --success-dim:rgba(34,229,132,0.16);
  --danger:#FF5468; --danger-dim:rgba(255,84,104,0.16);
  --warn:#FFB020; --warn-dim:rgba(255,176,32,0.16);
  --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:calc(70px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased;}
header{background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--border);}
header .brand{display:flex;align-items:center;gap:10px;}
header .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#FF6F45);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.01em;}
header .sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
main{padding:16px 16px 30px;max-width:600px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.daybar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);
  padding:10px 10px;margin-bottom:14px;border:1px solid var(--border);}
.daybar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);width:38px;height:38px;
  border-radius:var(--radius-sm);font-size:16px;font-weight:600;}
.daybar button:disabled{opacity:0.3;}
.daybar .center{text-align:center;flex:1;}
.daybar .center .d{font-size:15px;font-weight:700;}
.daybar .center .w{font-size:11.5px;color:var(--accent-text);font-weight:600;margin-top:1px;}
.daybar input[type=date]{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:11px;margin-top:5px;
  background:var(--surface2);color:var(--text);color-scheme:dark;}
.jumprow{display:flex;gap:5px;justify-content:center;margin-top:6px;}
.jumprow select{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:11px;font-family:inherit;
  background:var(--surface2);color:var(--text-dim);color-scheme:dark;}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;color:var(--accent-text);}
.card h3 .tag{font-size:10px;background:var(--surface2);color:var(--text-dim);padding:4px 9px;border-radius:20px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;}
.exrow{border-top:1px solid var(--border);padding-top:12px;margin-top:12px;}
.exrow:first-child{border-top:none;padding-top:0;margin-top:0;}
.exrow .exname{font-size:13.5px;font-weight:700;}
.exrow .extarget{font-size:11.5px;color:var(--text-dim);margin:2px 0 8px;}
.exrow a.demo{font-size:11px;color:var(--accent-text);text-decoration:none;font-weight:600;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 11px;
  font-size:15px;font-family:inherit;background:var(--surface2);color:var(--text);}
.field select{color-scheme:dark;}
.field textarea{min-height:44px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.pill-group{display:flex;gap:8px;}
.pill{flex:1;text-align:center;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13.5px;
  font-weight:700;background:var(--surface2);color:var(--text-dim);}
.pill.y.active{background:var(--success-dim);color:var(--success);border-color:var(--success);}
.pill.n.active{background:var(--danger-dim);color:var(--danger);border-color:var(--danger);}
.rest-note{font-size:13.5px;color:var(--text-dim);text-align:center;padding:14px 0;}
.skip-banner{display:flex;align-items:center;justify-content:space-between;background:var(--warn-dim);border:1px solid var(--warn);
  border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn);font-weight:600;}
.skip-toggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.skip-toggle .lbl{font-size:13.5px;font-weight:700;}
.switch{position:relative;width:46px;height:26px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;flex-shrink:0;}
.switch.on{background:var(--warn-dim);border-color:var(--warn);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:transform .15s;}
.switch.on .knob{background:var(--warn);transform:translateX(20px);}
nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;}
nav.bottomnav button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:10.5px;color:var(--text-faint);
  font-family:inherit;font-weight:600;}
nav.bottomnav button .ic{display:block;font-size:18px;margin-bottom:3px;}
nav.bottomnav button.active{color:var(--accent-text);}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-cards .card{margin-bottom:0;padding:13px;}
.stat-cards .label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;font-weight:600;letter-spacing:.02em;}
.stat-cards .value{font-size:22px;font-weight:800;margin-top:3px;}
.bar-row{margin-bottom:12px;font-size:12.5px;}
.bar-row .lbl{margin-bottom:4px;font-weight:600;}
.bar-track{background:var(--surface2);border-radius:8px;height:10px;overflow:hidden;}
.bar-fill{background:linear-gradient(90deg,var(--accent),#FF6F45);height:100%;border-radius:8px;}
.chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;color:var(--text-dim);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.hist-week{margin-bottom:6px;}
.hist-week summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;
  font-size:13.5px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;}
.hist-week summary::-webkit-details-marker{display:none;}
.hist-week summary .cnt{color:var(--text-dim);font-weight:600;font-size:11.5px;}
.hist-entry{background:var(--surface);border:1px solid var(--border);border-top:none;padding:10px 13px;font-size:12.5px;}
.hist-entry:last-child{border-radius:0 0 var(--radius-sm) var(--radius-sm);}
.hist-entry .hd{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px;}
.hist-entry .meta{color:var(--text-dim);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.toolbar button{background:var(--accent);color:#fff;border:none;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;}
.toolbar button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.toolbar button.danger{background:var(--danger-dim);color:var(--danger);border:1px solid var(--danger);}
.note{background:var(--accent-dim);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:11px 13px;
  font-size:12px;color:var(--accent-text);margin-bottom:14px;}
a.demo{color:var(--accent-text);}
h2{font-size:18px;margin:0 0 12px;font-weight:800;color:var(--accent-text);}
ol.mob-ol{margin:0;padding-left:18px;font-size:13px;line-height:1.9;}
table.ref-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);border-radius:var(--radius-sm);
  overflow:hidden;border:1px solid var(--border);}
table.ref-table th,table.ref-table td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;}
table.ref-table th{background:var(--surface2);color:var(--text-dim);font-size:11px;text-transform:uppercase;font-weight:700;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">HM</div>
    <div>
      <h1>Hockey Masters Trainer</h1>
      <div class="sub">41-50 &middot; 12-week program &middot; logs on this device</div>
    </div>
  </div>
</header>

<main>
  <div class="panel active" id="panel-today"></div>
  <div class="panel" id="panel-history"></div>
  <div class="panel" id="panel-dashboard"></div>
  <div class="panel" id="panel-reference"></div>
</main>

<nav class="bottomnav">
  <button data-tab="today" class="active"><span class="ic">&#9679;</span>Today</button>
  <button data-tab="history"><span class="ic">&#9776;</span>History</button>
  <button data-tab="dashboard"><span class="ic">&#9650;</span>Dashboard</button>
  <button data-tab="reference"><span class="ic">&#9776;&#65039;</span>Reference</button>
</nav>

<script>
/* ================= DATA MODEL — this is the single source of truth (no separate desktop app anymore).
 * Open this same file in a desktop browser to review; the "skip" map tracks rest/injury/illness/busy days
 * separately from normal completion so adherence stats don't get dragged down by legitimate rest. ================= */
const START_DATE = new Date(2026,7,10); // Monday 10 Aug 2026 — program start, also the earliest navigable day
const WEEKS = 12;
const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_NAMES_FULL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SKIP_REASONS = ["Rest","Injured","Ill","Busy / Work","Match","Hockey Training","Other"];
const HEALTH_SKIP_REASONS = ["Injured","Ill"]; // these get their own dashboard metric, separate from planned rest

function weekBlock(week){ const i=(week-1)%6; return i<2?"Wk1-2": i<4?"Wk3-4":"Wk5-6"; }
function cycleOf(week){ return week<=6?1:2; }
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ return String(d.getDate()).padStart(2,'0')+' '+MONTH_ABBR[d.getMonth()]+' '+d.getFullYear(); }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const WORKOUT1_EXERCISES = [
 ["1",null,"Barbell Squat","https://youtu.be/LIit6CliTK8","Barbell Squat","https://youtu.be/LIit6CliTK8",[4,"10-12","90s"],[3,"8-10","90s"],[3,"8","90s"]],
 ["2",null,"Single Leg Hip Thrust","https://youtu.be/wuifoTEpKWY","Single Leg Hip Thrust","https://youtu.be/wuifoTEpKWY",[3,"12","60s"],[3,"10","60s"],[2,"10","60s"]],
 ["3",null,"Copenhagen Hold","https://youtu.be/xWrF-5sSNrk","Copenhagen Hold","https://youtu.be/xWrF-5sSNrk",[2,"20s","60s"],[2,"25s","60s"],[2,"30s","60s"]],
 ["4A","4","Dumbbell Chest Press","https://youtu.be/tNvd_mR7u3Y","Press Up","https://youtu.be/ToKacH5rELw",[3,"12","-"],[3,"10","-"],[3,"8","-"]],
 ["4B","4","Single Arm Row","https://youtu.be/fHP3NBi0rFY","Bird Dog","https://www.youtube.com/watch?v=vzU5xrs1gMQ",[3,"12","90s"],[3,"10","90s"],[3,"8","90s"]],
 ["5A","5","Deadbug","https://youtu.be/Zqc3wxGUoWE","Deadbug","https://youtu.be/Zqc3wxGUoWE",[3,"20s","-"],[2,"25s","-"],[2,"30s","-"]],
 ["5B","5","Side Plank","https://youtu.be/BDnJuIfF5BM","Side Plank","https://youtu.be/BDnJuIfF5BM",[3,"16s e.s","60s"],[3,"20s e.s","60s"],[2,"25s e.s","60s"]],
];
const WORKOUT2_EXERCISES = [
 ["1",null,"Depth Jump","https://youtu.be/Gr9bc33Vlcs","Depth Jump","https://youtu.be/Gr9bc33Vlcs",[3,"6","90s"],[3,"6","90s"],[2,"6","90s"]],
 ["2",null,"Stiff Leg Deadlift","https://youtu.be/5-sc5-OTAJI","Hamstring Walkout","https://youtu.be/U1DpaLuIhBA",[3,"8","90s"],[3,"8","90s"],[2,"8","90s"]],
 ["3A","3","DB Walking Lunge","https://youtu.be/uYwB7xWfP4o","Walking Lunge","https://youtu.be/aPhFnhn_5jA",[3,"20","-"],[3,"16","-"],[2,"16","-"]],
 ["3B","3","Calf Raises","https://youtu.be/yMykDWKJtvo","Calf Raises","https://youtu.be/yMykDWKJtvo",[3,"15","60s"],[3,"12","60s"],[3,"10","60s"]],
 ["4A",null,"Pull Up (assisted or not)","https://youtu.be/zwFbF4GmU2c","Prone W+Y","https://youtu.be/m_IYvsfWRHo",[3,"8","90s"],[3,"6","90s"],[2,"6","90s"]],
 ["5A","5","Overhead Press","https://youtu.be/BC8u_q9cWI8","Tricep Dip","https://www.youtube.com/watch?v=C9pWva7Eglo",[3,"10","-"],[3,"8","-"],[2,"8","-"]],
 ["5B","5","Cable Core Rotation","https://youtu.be/cz_gNMhRLaA","Shoulder Tap","https://youtu.be/_Kv0nz8p4r8",[3,"12 e.s","90s"],[3,"10 e.s","90s"],[2,"10 e.s","90s"]],
];
const CARDIO_TARGETS = {
 "Steady":{"Wk1-2":"30 min continuous — Zone 2 / talking pace","Wk3-4":"40 min continuous — Zone 2 / talking pace","Wk5-6":"25 min continuous — Zone 3 / 7/10 difficulty"},
 "Sprint / COD":{"Wk1-2":"20m sprints x6, 60s rest — then Flying sprint: jog 10m in, sprint 40m, x4, 60s rest — max effort","Wk3-4":"20m sprints x5, 60s rest — then T-Drill x4, 90s rest — max effort (<a class=\"demo\" href=\"https://youtu.be/O3hyDIAPoR0\" target=\"_blank\" rel=\"noopener\">demo&#9654;</a>)","Wk5-6":"20m sprints x4, 60s rest — then Shuttle 5m/10m/15m x5, 30s rest — max effort"},
 "Interval":{"Wk1-2":"4 sets: 4min ON / 2min OFF — 80-90% max HR","Wk3-4":"6 sets: 2min ON / 1min OFF — 80-90% max HR","Wk5-6":"6 sets: 1min ON / 1min OFF — 80-90% max HR"},
 "Hockey Match":{"Wk1-2":"Match — replaces Interval","Wk3-4":"Match — replaces Interval","Wk5-6":"Match — replaces Interval"}
};
const CARDIO_TYPES = Object.keys(CARDIO_TARGETS);
const CARDIO_BY_DAYINDEX = {0:"Steady", 2:"Sprint / COD", 5:"Interval"};
const CARDIO_SLOT_BY_DAYINDEX = {0:1, 2:2, 5:3};
const MOBILITY_ROUTINE = [
 ["Hamstring Floss","10 each side","https://youtu.be/V11YSUcHKl4"],
 ["Pigeon Stretch","30s each side","https://youtu.be/X9e6Aioxg-4"],
 ["90/90 Hip Switch","8 each side","https://youtu.be/KAMwpM13KPI"],
 ["Hip CARs","8 each side","https://youtu.be/gWHMkTYpoaQ"],
 ["World's Greatest Stretch","6 each side","https://youtu.be/n0D5R98gRac"],
 ["Thread the Needle","6 each side","https://youtu.be/hK6thmaDRLI"],
 ["Angry Cat / Happy Cat","30s","https://youtu.be/XNx5DjojPVU"],
 ["Prone W + Y","5 each exercise","https://youtu.be/m_IYvsfWRHo"],
];
const INJURY_TYPES = ["Ankle Sprain","Hamstring Strain","Calf Strain","Knee - Patellar Tendinitis","Knee - ACL","Knee - Meniscus","Achilles Tendinopathy","Adductor Strain","Shoulder","Lower Back","Other"];
const STATUS_TYPES = ["Active","Recovering","Resolved"];
const RPE_LEGEND = "0 rest &middot; 2 light &middot; 4 moderate &middot; 6 hard &middot; 8 very hard &middot; 10 max effort";

/* ================= STORAGE ================= */
const STORE_KEY = "hockey_tracker_v3";
// NEVER bump STORE_KEY to migrate the schema — that orphans existing users' data under the old key
// (silently invisible, not technically deleted, but indistinguishable from data loss to the user).
// Instead bump SCHEMA_VERSION and add a migration step in migrateData() below.
const SCHEMA_VERSION = 1;
let DATA = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
function applyDefaults(d){
  d.w1 = d.w1 || {}; d.w2 = d.w2 || {}; d.cardio = d.cardio || {};
  d.mobility = d.mobility || {}; d.body = d.body || {}; d.injury = d.injury || {};
  d.skip = d.skip || {}; // "{week}_{dayIndex}": {skipped:true, reason:"Injured"}
  d.settings = d.settings || {}; // one-off values that don't change weekly, e.g. height for BMI
  d.session = d.session || {}; // "{w1|w2}_{week}": {rpe, duration} — whole-session RPE, separate from per-exercise w1/w2 rows
  d.tests = d.tests || {}; // "{1|6|12}": {sprint, cod, jump, run} — baseline/mid/final fitness benchmarks
  return d;
}
function migrateData(){
  // Runs on every load and after every import. If DATA predates schemaVersion tracking, it's
  // implicitly version 0 (unversioned) — add real migration steps here as `if(v < N){...}` blocks
  // whenever the schema changes in the future, then stamp schemaVersion = SCHEMA_VERSION at the end.
  const v = DATA.schemaVersion || 0;
  if(v < 1){ /* no migration needed yet — v1 is the current baseline schema */ }
  DATA.schemaVersion = SCHEMA_VERSION;
}
applyDefaults(DATA);
migrateData();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }

/* ================= NAV ================= */
document.querySelectorAll('nav.bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>selectTab(b.dataset.tab));
});
function selectTab(id){
  document.querySelectorAll('nav.bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  if(id==='dashboard') renderDashboard();
  if(id==='history') renderHistory();
}

/* ================= TODAY VIEW ================= */
const MIN_DATE = startOfDay(START_DATE);
let currentDate = startOfDay(new Date()) < MIN_DATE ? MIN_DATE : startOfDay(new Date());

function weekInfoFor(date){
  const days = Math.round((startOfDay(date) - START_DATE) / 86400000);
  if(days >= WEEKS*7) return {inProgram:false};
  const week = Math.floor(days/7)+1;
  const dayIndex = days%7;
  return {inProgram:true, week, dayIndex, block:weekBlock(week), cycle:cycleOf(week)};
}

function fieldHtml(label, inputHtml){
  return `<div class="field"><label>${esc(label)}</label>${inputHtml}</div>`;
}
function ynPills(k, row, f, val){
  return `<div class="pill-group">
    <div class="pill y ${val==='Y'?'active':''}" onclick="setPill('${k}','${row}','${f}','Y',this)">Yes</div>
    <div class="pill n ${val==='N'?'active':''}" onclick="setPill('${k}','${row}','${f}','N',this)">No</div>
  </div>`;
}
function setPill(k,row,f,val,el){
  DATA[k][row] = DATA[k][row] || {};
  const cur = DATA[k][row][f];
  DATA[k][row][f] = (cur===val) ? '' : val;
  save();
  const group = el.parentElement;
  group.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  if(DATA[k][row][f]) el.classList.add('active');
}
function bindField(el){
  const evt = (el.tagName==='TEXTAREA'||el.type==='number'||el.type==='text') ? 'input' : 'change';
  el.addEventListener(evt, ()=>{
    const {k,row,f} = el.dataset;
    if(!k||!row||!f) return;
    DATA[k][row] = DATA[k][row] || {};
    DATA[k][row][f] = el.value;
    save();
  });
}
function wireCard(container){
  container.querySelectorAll('input,select,textarea').forEach(bindField);
}

function renderToday(){
  const panel = document.getElementById('panel-today');
  const info = weekInfoFor(currentDate);
  const isToday = ymd(currentDate)===ymd(startOfDay(new Date()));
  const atMin = ymd(currentDate)===ymd(MIN_DATE);

  const jumpWeek = info.inProgram ? info.week : WEEKS;
  const jumpDay = info.inProgram ? info.dayIndex : 6;
  let html = backupReminderBanner();
  html += `<div class="daybar">
    <button onclick="shiftDay(-1)" ${atMin?'disabled':''}>&#8592;</button>
    <div class="center">
      <div class="d">${esc(DAY_NAMES_FULL[(currentDate.getDay()+6)%7])}${isToday?' &middot; today':''}</div>
      <div class="w">${fmtDate(currentDate)}${info.inProgram ? '' : ' · after program'}</div>
      <div class="jumprow">
        <select id="jump-week" onchange="jumpToWeekDay()">

  if(!info.inProgram){
    html += `<div class="note">This date is past the 12-week program. You can still browse History or Reference, or jump back with the date picker above.</div>`;
    panel.innerHTML = html;
    return;
  }

  const { week, dayIndex, block } = info;
  const dayKey = `${week}_${dayIndex}`;
  const skipRec = DATA.skip[dayKey] || {};
  const hasSession = dayIndex===1 || dayIndex===3 || CARDIO_BY_DAYINDEX[dayIndex]!==undefined;

  // Rest/skip/alternate-activity toggle — available every day. On a programmed day it replaces that
  // day's gym/cardio form; on a rest day it's just an optional way to log a match or club training.
  const isHockeyReason = skipRec.skipped && (skipRec.reason==='Match' || skipRec.reason==='Hockey Training');

    ${isHockeyReason ? `

  // Match/Hockey Training is additive, not exclusive — log it AND still fill in the programmed
  // session below if you did both (e.g. cardio in the morning, training in the evening).
  if(isHockeyReason){
    html += `<div class="skip-banner" style="background:var(--success-dim);border-color:var(--success);color:var(--success)"><span>${esc(skipRec.reason)} logged for today</span></div>`;

  } else if(CARDIO_BY_DAYINDEX[dayIndex]){

    ${fieldHtml('Notes', `<input data-k="mobility" data-row="${dayKey}" data-f="notes" value="${esc(mobRec.notes||'')}">`)}

  // Weekly bodyweight check-in (Monday only)
  if(dayIndex===0){
    const bodyRec = DATA.body[String(week)] || {};
    html += `<div class="card"><h3>Weekly check-in <span class="tag">Week ${week}</span></h3>

  html += `<details class="card" style="padding:0">

    <div style="padding:0 16px 16px">
      ${fieldHtml('Body part / type', `<select data-k="injury" data-row="${dayKey}" data-f="type">

      <div class="row2">

function shiftDay(n){
  const next = addDays(currentDate, n);
  if(next < MIN_DATE) return;
  currentDate = next;
  renderToday();
}
function jumpToDate(val){
  const [y,m,d] = val.split('-').map(Number);
  let next = new Date(y,m-1,d);
  if(next < MIN_DATE) next = MIN_DATE;
  currentDate = next;
  renderToday();
}
function jumpToWeekDay(){
  const week = parseInt(document.getElementById('jump-week').value,10);
  const dayIndex = parseInt(document.getElementById('jump-day').value,10);
  currentDate = addDays(START_DATE, (week-1)*7 + dayIndex);
  renderToday();
}
function onCardioTypeChange(rowKey, val){
  DATA.cardio[rowKey] = DATA.cardio[rowKey] || {};
  DATA.cardio[rowKey].type = val;
  save();
  const week = parseInt(rowKey.split('_')[0],10);
  const block = weekBlock(week);
  // innerHTML (not textContent) — target text can contain a demo-video link, e.g. Sprint/COD's T-Drill
  document.getElementById('cardio-target-'+rowKey).innerHTML = (CARDIO_TARGETS[val]||{})[block] || '';
}
function toggleSkip(dayKey){
  const rec = DATA.skip[dayKey] || {};
  rec.skipped = !rec.skipped;
  if(rec.skipped && !rec.reason) rec.reason = 'Rest';
  DATA.skip[dayKey] = rec;
  save();
  renderToday();
}
function onSkipReasonChange(dayKey, val){
  DATA.skip[dayKey] = DATA.skip[dayKey] || {skipped:true};
  DATA.skip[dayKey].reason = val;
  save();
  renderToday(); // reason change toggles the Match/Hockey Training metric fields on/off — must re-render to show them
}

/* ================= HISTORY VIEW ================= */
let historyFilter = 'all';
function renderHistory(){
  const panel = document.getElementById('panel-history');
  const chips = ['all','strength','cardio','mobility','body','injury','skipped','tests'];
  let html = `<h2>History</h2>
  <div class="chip-row">${chips.map(c=>`<div class="chip ${historyFilter===c?'active':''}" onclick="setHistoryFilter('${c}')">${c[0].toUpperCase()+c.slice(1)}</div>`).join('')}</div>
  <div id="history-list"></div>`;
  panel.innerHTML = html;
  renderHistoryList();
}
function setHistoryFilter(c){ historyFilter = c; renderHistory(); }
function renderHistoryList(){
  const el = document.getElementById('history-list');
  let out = '';
  for(let week=WEEKS; week>=1; week--){
    let entries = [];
    if(historyFilter==='all'||historyFilter==='strength'){
      ['w1','w2'].forEach(k=>{
        Object.entries(DATA[k]).forEach(([rowKey,rec])=>{
          if(!rowKey.startsWith(week+'_')) return;
          if(!rec || (!rec.used && !rec.actual && !rec.weight && !rec.done)) return;
          entries.push({title:(k==='w1'?'Workout 1':'Workout 2')+' — '+rowKey.split('_')[1], meta:`${rec.used||''} ${rec.actual||''} ${rec.weight?rec.weight+'kg':''} ${rec.done==='Y'?'✓':''}`});
        });
        const sessRec = DATA.session[`${k}_${week}`];
        if(sessRec && ((sessRec.rpe!==undefined && sessRec.rpe!=='') || sessRec.duration)){
          entries.push({title:(k==='w1'?'Workout 1':'Workout 2')+' — Session RPE', meta:`${sessRec.rpe!==undefined&&sessRec.rpe!==''?'RPE '+sessRec.rpe:''} ${sessRec.duration?sessRec.duration+'min':''}`});
        }
      });
    }
    if(historyFilter==='all'||historyFilter==='cardio'){
      [1,2,3].forEach(s=>{
        const rec = DATA.cardio[`${week}_${s}`];
        if(!rec || (!rec.dist && !rec.dur && !rec.hr && !rec.done)) return;
        entries.push({title:'Cardio — '+(rec.type||''), meta:`${rec.dist?rec.dist+'km':''} ${rec.dur?rec.dur+'min':''} ${rec.hr?rec.hr+'bpm':''} ${rec.rpe!==undefined&&rec.rpe!==''?'RPE '+rec.rpe:''} ${rec.done==='Y'?'✓':''}`});
      });
    }
    if(historyFilter==='all'||historyFilter==='mobility'){
      DAY_NAMES.forEach((d,di)=>{
        const rec = DATA.mobility[`${week}_${di}`];
        if(!rec || (!rec.full && !rec.quick)) return;
        entries.push({title:'Mobility — '+d, meta:`Full:${rec.full||'-'} Quick:${rec.quick||'-'} Tightness:${rec.tight??'-'}`});
      });
    }
    if(historyFilter==='all'||historyFilter==='body'){
      const rec = DATA.body[String(week)];
      if(rec && (rec.weight || rec.rhr)) entries.push({title:'Body check-in', meta:`${rec.weight?rec.weight+'kg':''} ${rec.rhr?rec.rhr+'bpm RHR':''}`});
    }
    if(historyFilter==='all'||historyFilter==='injury'){
      DAY_NAMES.forEach((d,di)=>{
        const rec = DATA.injury[`${week}_${di}`];
        if(!rec) return;
        if(rec.sleep) entries.push({title:'Sleep — '+d, meta:`${rec.sleep} hrs`});
        if(rec.type) entries.push({title:'Injury — '+d, meta:`${rec.type} · severity ${rec.severity??'-'} · ${rec.status||'-'}`});
      });
    }
    if(historyFilter==='all'||historyFilter==='skipped'){
      DAY_NAMES.forEach((d,di)=>{
        const rec = DATA.skip[`${week}_${di}`];
        if(!rec || !rec.skipped) return;
        const isHockey = rec.reason==='Match' || rec.reason==='Hockey Training';
        const title = isHockey ? rec.reason+' — '+d : 'Skipped — '+d;
        const meta = isHockey
          ? `${rec.reason==='Match'&&rec.opponent?'vs '+rec.opponent+' ':''}${rec.reason==='Match'&&rec.result?'('+rec.result+') ':''}${rec.distance?rec.distance+'km ':''}${rec.duration?rec.duration+'min ':''}${rec.hr?rec.hr+'bpm ':''}${rec.calories?rec.calories+'kcal':''}`
          : rec.reason||'Rest';
        entries.push({title, meta});
      });
    }
    if((historyFilter==='all'||historyFilter==='tests') && ['1','6','12'].includes(String(week))){
      const t = DATA.tests[String(week)];
      if(t && (t.sprint||t.cod||t.jump||t.run)){
        entries.push({title:'Fitness Test — Week '+week, meta:`${t.sprint?'Sprint '+t.sprint+'s':''} ${t.cod?'505 '+t.cod+'s':''} ${t.jump?'Jump '+t.jump+'cm':''} ${t.run?'Cooper '+t.run+'m':''}`});
      }
    }
    if(!entries.length) continue;
    out += `<details class="hist-week"><summary>Week ${week} <span class="cnt">${entries.length} entries</span></summary>
      ${entries.map(e=>`<div class="hist-entry"><div class="hd">${esc(e.title)}</div><div class="meta">${esc(e.meta.trim()||'—')}</div></div>`).join('')}
    </details>`;
  }
  el.innerHTML = out || `<div class="note">No entries logged yet for this filter.</div>`;
}

/* ================= DASHBOARD ================= */
// A genuinely skipped session (Rest/Injured/Ill/Busy/Other) is excluded from both numerator and
// denominator — it's not a missed session, it was a deliberate call, so it shouldn't drag adherence
// % down. Match/Hockey Training is different: it's additive (you may have ALSO done the programmed
// session that day), so it must NOT be excluded the same way — otherwise a real cardio/strength
// "done=Y" saved on a day you also logged training silently drops out of the adherence math. If you
// logged Match/Training instead of the programmed session (no exercises/cardio actually marked done
// that day), it auto-credits as completed, per the "counts as completed" design.
const GENUINE_SKIP_REASONS = ["Rest","Injured","Ill","Busy / Work","Other"];
function countDone(obj, field){ let d=0; Object.values(obj).forEach(r=>{ if(r && r[field]==='Y') d++; }); return d; }
function isGenuineSkip(week, dayIndex){ const r = DATA.skip[`${week}_${dayIndex}`]; return !!(r && r.skipped && GENUINE_SKIP_REASONS.includes(r.reason)); }
function isHockeyLogged(week, dayIndex){ const r = DATA.skip[`${week}_${dayIndex}`]; return !!(r && r.skipped && (r.reason==='Match' || r.reason==='Hockey Training')); }
function strengthAdherence(key, dayIndex){
  let done=0, total=0;
  const exList = key==='w1' ? WORKOUT1_EXERCISES : WORKOUT2_EXERCISES;
  const exCount = exList.length;
  for(let week=1; week<=WEEKS; week++){
    if(isGenuineSkip(week, dayIndex)) continue;
    total += exCount;
    let dayDone = 0;
    exList.forEach(ex=>{ const rec = DATA[key][`${week}_${ex[0]}`]; if(rec && rec.done==='Y') dayDone++; });
    done += (dayDone===0 && isHockeyLogged(week, dayIndex)) ? exCount : dayDone;
  }
  return {done, total};
}
function cardioAdherence(){
  let done=0, total=0;
  for(let week=1; week<=WEEKS; week++){
    [0,2,5].forEach((dayIndex,i)=>{
      if(isGenuineSkip(week, dayIndex)) return;
      total++;
      const rec = DATA.cardio[`${week}_${i+1}`];
      const realDone = !!(rec && rec.done==='Y');
      if(realDone || isHockeyLogged(week, dayIndex)) done++;
    });
  }
  return {done, total};
}
// Unlike strengthAdherence/cardioAdherence (which measure how well you stuck to the PROGRAMMED plan
// and exclude Match/Hockey Training as neutral), this is a plain running total of every completed
// training instance — a completed strength day, a completed cardio day, a match, or a hockey training
// session. Deliberately NOT scored against a fixed number of days: you won't train or play every day,
// so a "X/84" denominator would just read as a shortfall. Each activity type is deduped per-day within
// itself (so ticking every exercise in a workout only counts once) but different activity types on the
// same day (e.g. cardio in the morning, training in the evening) both count.
// Single source of truth for the activity mix — used by both the "Total training days logged" stat
// and the end-of-dashboard pie chart, so the two can never drift out of sync with each other.
function trainingBreakdown(){
  const strengthDays = new Set(), cardioDays = new Set();
  Object.entries(DATA.w1).forEach(([k,r])=>{ if(r && r.done==='Y') strengthDays.add('w1_'+k.split('_')[0]); });
  Object.entries(DATA.w2).forEach(([k,r])=>{ if(r && r.done==='Y') strengthDays.add('w2_'+k.split('_')[0]); });
  Object.entries(DATA.cardio).forEach(([k,r])=>{ if(r && r.done==='Y') cardioDays.add(k); });
  let match=0, training=0;
  Object.values(DATA.skip).forEach(r=>{
    if(!r || !r.skipped) return;
    if(r.reason==='Match') match++;
    else if(r.reason==='Hockey Training') training++;
  });
  return { strength: strengthDays.size, cardio: cardioDays.size, match, training };
}
function activeTrainingDays(){
  const b = trainingBreakdown();
  return b.strength + b.cardio + b.match + b.training;
}
function weeklyCardioDistance(week){
  let total=0,count=0;
  for(let s=1;s<=3;s++){ const rec=DATA.cardio[`${week}_${s}`]; if(rec){ if(rec.dist) total+=parseFloat(rec.dist)||0; if(rec.done==='Y') count++; } }
  return {total,count};
}
function setHeight(val){ DATA.settings.heightCm = val; save(); renderDashboard(); }
// BMI from the latest logged bodyweight and a one-off height you enter once (stored in
// DATA.settings.heightCm). Standard BMI cutoffs are population-level and don't account for muscle
// mass — for someone doing heavy strength work, a "high" BMI may just mean more muscle, not more fat.
// Shown with that caveat rather than as a clean pass/fail number.
function currentBMI(){
  const heightCm = parseFloat(DATA.settings.heightCm);
  if(!heightCm || heightCm<=0) return null;
  let latestWeight=null;
  for(let w=WEEKS; w>=1; w--){
    const r = DATA.body[String(w)];
    if(r && r.weight!==undefined && r.weight!==''){ latestWeight = parseFloat(r.weight); break; }
  }
  if(latestWeight==null || isNaN(latestWeight)) return null;
  const heightM = heightCm/100;
  const bmi = latestWeight/(heightM*heightM);
  const category = bmi<18.5?'Underweight' : bmi<25?'Normal' : bmi<30?'Overweight' : 'Obese';
  return { bmi, category };
}
// Detects exercises whose target is a timed hold (e.g. "20s", "16s e.s") rather than a rep count
// (e.g. "10-12", "12 e.s") — Epley 1RM estimation is meaningless for an isometric hold, so those get
// charted as raw weight instead. Checked against the Wk1-2 target only, since an exercise's fundamental
// nature (timed vs rep-based) doesn't change across blocks, only the numbers do.
function repsAreTimeBased(repsStr){ return /^\d+s(\s|$)/.test(String(repsStr).trim()); }

function strengthExerciseList(){
  const build = (key, group, list) => list.map(ex=>{
    const [slot,sup,gymEx,gymLink,homeEx,homeLink,t12,t34,t56] = ex;
    return { key, slot, group, label:`${gymEx} / ${homeEx}`, timeBased: repsAreTimeBased(t12[1]),
      targets:{ "Wk1-2":t12, "Wk3-4":t34, "Wk5-6":t56 } };
  });
  return [...build('w1','Workout 1',WORKOUT1_EXERCISES), ...build('w2','Workout 2',WORKOUT2_EXERCISES)];
}

// Estimated 1RM uses the WEEK'S PRESCRIBED reps, not the freeform "Actual (sets x reps)" text field —
// that field is unstructured (people type "3x10", "10,10,8", "8 reps", anything), too unreliable to
// parse into a rep count. Prescribed reps is a defensible stand-in when the session was followed as
// programmed, and the chart labels it explicitly as an estimate rather than presenting it as exact.
function strengthProgressionSeries(key, slot){
  const info = strengthExerciseList().find(e=>e.key===key && e.slot===slot);
  if(!info) return { values:[], timeBased:false, label:'' };
  const weeks = Array.from({length:WEEKS},(_,i)=>i+1);
  const values = weeks.map(week=>{
    const rec = DATA[key][`${week}_${slot}`];
    if(!rec || rec.weight===undefined || rec.weight==='') return null;
    const weight = parseFloat(rec.weight);
    if(isNaN(weight)) return null;
    if(info.timeBased) return weight;
    const repsStr = String(info.targets[weekBlock(week)][1]);
    const repsMatch = repsStr.match(/\d+/);
    const reps = repsMatch ? parseFloat(repsMatch[0]) : null;
    return reps ? weight * (1 + reps/30) : weight; // Epley; falls back to raw weight if reps unparseable
  });
  return { values, timeBased: info.timeBased, label: info.label };
}

// Weekly training load = session RPE x session duration (mins), summed across every session logged
// that week (Workout 1, Workout 2, and all three cardio slots) — the standard Foster sRPE method. Lets
// load spikes show up even when raw RPE looks flat: a short brutal session and a long moderate one can
// report the same RPE but represent very different strain on the body.
function weeklyTrainingLoad(week){
  let load = 0, any = false;
  ['w1','w2'].forEach(key=>{
    const r = DATA.session[`${key}_${week}`];
    if(r && r.rpe!==undefined && r.rpe!=='' && r.duration){ load += (parseFloat(r.rpe)||0) * (parseFloat(r.duration)||0); any = true; }
  });
  for(let s=1; s<=3; s++){
    const r = DATA.cardio[`${week}_${s}`];
    if(r && r.rpe!==undefined && r.rpe!=='' && r.dur){ load += (parseFloat(r.rpe)||0) * (parseFloat(r.dur)||0); any = true; }
  }
  return any ? load : null; // null (not 0) when nothing logged, so the chart shows a gap rather than a false zero
}

// Change from the Week 1 baseline test to the latest test logged (Week 6 if present, else Week 12).
// higherIsBetter distinguishes sprint/COD (lower=faster=better) from jump/run (higher=further=better).
function testDelta(field, higherIsBetter){
  const w1 = DATA.tests['1'];
  const w1v = w1 && w1[field]!==undefined && w1[field]!=='' ? parseFloat(w1[field]) : null;
  let latestWeek=null, latestV=null;
  ['12','6'].forEach(w=>{
    if(latestV!=null) return;
    const r = DATA.tests[w];
    if(r && r[field]!==undefined && r[field]!==''){ latestWeek=w; latestV=parseFloat(r[field]); }
  });
  if(w1v==null || latestV==null || latestWeek==='1') return null;
  const delta = latestV - w1v;
  const improved = higherIsBetter ? delta>0 : delta<0;
  return { delta, latestWeek, improved };
}
function testFieldRow(label, field, unit, protocol){

    <div style="font-size:11px;color:var(--text-faint);margin:-2px 0 6px">${esc(protocol)}</div>

    </div></div>`;
}
function testDeltaHtml(field, unit, higherIsBetter){
  const d = testDelta(field, higherIsBetter);
  if(!d) return '';
  const color = d.improved ? 'var(--success)' : 'var(--danger)';
  return `<div style="font-size:11.5px;color:${color};margin:-4px 0 12px">Wk1 &rarr; Wk${d.latestWeek}: ${d.delta>0?'+':''}${d.delta.toFixed(2)}${unit} &mdash; ${d.improved?'improved':'declined'}</div>`;
}

// ROOT CAUSE of the "charts don't fit their boxes" bug: setting canvas.width/canvas.height (the
// bitmap-resolution attributes) with no matching CSS size pins the DISPLAYED box to those attribute
// values too, once devicePixelRatio > 1 (any Retina iPhone/iPad, dpr=2 or 3) that inflates the visible
// card to 2-3x the intended height/width — exactly what the screenshot showed (tiny plot crammed into
// the top of a huge card). Fix: explicitly lock canvas.style.width/height to the logical CSS size, and
// only use the *2 (not *dpr) buffer for text sharpness — separate from anything used for user-facing math.
function drawLineChart(canvasId, weeks, values, color){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 32 || 280; // card content width minus its own padding
  const h = 90;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const nums = values.filter(v=>v!=null&&!isNaN(v)&&v!==0);
  if(nums.length===0){
    ctx.fillStyle='#5C6675'; ctx.font='11px Inter'; ctx.textAlign='center';
    ctx.fillText('No data logged yet', w/2, h/2+4);
    ctx.textAlign='left';
    return;
  }

  const padL=30,padR=8,padT=8,padB=16;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const rawMax = Math.max(...nums);
  const maxV = rawMax*1.15 || 1;
  // Pick label precision from the data's own scale so small values (e.g. sleep hours) don't all round to
  // the same integer — that was producing duplicate "1, 1, 0" axis labels when nothing had been logged yet.
  const decimals = maxV < 3 ? 1 : maxV < 15 ? 1 : 0;
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.font='8px Inter'; ctx.fillStyle='#5C6675';
  for(let i=0;i<=2;i++){ const y=padT+plotH-(plotH*i/2); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); ctx.fillText((maxV*i/2).toFixed(decimals),2,y+3); }
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); let started=false;
  values.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const x=padL+plotW*(i/(weeks.length-1)); const y=padT+plotH-(plotH*(v/(maxV||1))); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle=color;
  values.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const x=padL+plotW*(i/(weeks.length-1)); const y=padT+plotH-(plotH*(v/(maxV||1))); ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); });
  // X-axis: always anchor the first and last week so the chart visibly spans the full 12-week program,
  // plus a couple of markers in between.
  ctx.fillStyle='#5C6675'; ctx.font='8px Inter';
  const lastIdx = weeks.length-1;
  weeks.forEach((wk,i)=>{
    if(i!==0 && i!==lastIdx && wk%3!==1) return;
    const x=padL+plotW*(i/lastIdx);
    const align = i===0 ? 0 : i===lastIdx ? -14 : -6;
    ctx.fillText('W'+wk, x+align, h-3);
  });
}
// Simple custom pie chart (consistent with drawLineChart — no external chart library). Renders arcs
// plus an HTML legend with percentages underneath, since reading exact values off a bare pie is unreliable.
function drawPieChart(canvasId, legendId, segments){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const legendEl = document.getElementById(legendId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 180;
  canvas.style.width = size+'px'; canvas.style.height = size+'px';
  canvas.width = Math.round(size*dpr); canvas.height = Math.round(size*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);

  const total = segments.reduce((a,s)=>a+s.value,0);
  const cx=size/2, cy=size/2, r=size/2-4;
  if(total===0){
    ctx.fillStyle='#5C6675'; ctx.font='11px Inter'; ctx.textAlign='center';
    ctx.fillText('No activity logged yet', cx, cy+4);
    ctx.textAlign='left';
    if(legendEl) legendEl.innerHTML = '';
    return;
  }
  let start = -Math.PI/2;
  segments.forEach(s=>{
    if(s.value<=0) return;
    const slice = (s.value/total) * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+slice); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    start += slice;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  if(legendEl){
    legendEl.innerHTML = segments.map(s=>{
      const pct = total ? Math.round(s.value/total*100) : 0;
      return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0">
        <div style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0"></div>
        <div style="flex:1;color:var(--text-dim)">${esc(s.label)}</div>
        <div style="font-weight:700">${s.value} <span style="color:var(--text-faint);font-weight:400">(${pct}%)</span></div>
      </div>`;
    }).join('');
  }
}

  <div class="toolbar"><button class="danger" onclick="if(confirm('Clear all logged data on this device?')) clearAll()">Clear all data</button></div>`;
}
function icsDate(date, hour, min){
  const p = n => String(n).padStart(2,'0');
  return date.getFullYear()+p(date.getMonth()+1)+p(date.getDate())+'T'+p(hour)+p(min)+'00';
}
function downloadICS(){
  const events = [
    {name:'Steady Cardio', day:0, hour:7},
    {name:'Strength — Workout 1', day:1, hour:7},
    {name:'Sprint / COD Cardio', day:2, hour:7},
    {name:'Strength — Workout 2', day:3, hour:7},
    {name:'Interval Cardio (or Hockey Match)', day:5, hour:7},
    {name:'Mobility routine', day:null, hour:6, min:45}, // daily
  ];
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Hockey Masters Trainer//EN\r\nCALSCALE:GREGORIAN\r\n';
  events.forEach((ev,i)=>{
    const isDaily = ev.day===null;
    const firstDate = isDaily ? START_DATE : addDays(START_DATE, ev.day);
    const lastDate = isDaily ? addDays(START_DATE, WEEKS*7-1) : addDays(START_DATE, ev.day + (WEEKS-1)*7);
    const dtstart = icsDate(firstDate, ev.hour, ev.min||0);
    const untilDate = icsDate(lastDate, ev.hour, ev.min||0);
    const rrule = isDaily ? `FREQ=DAILY;UNTIL=${untilDate}` : `FREQ=WEEKLY;UNTIL=${untilDate}`;
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:hmt-'+i+'-'+Date.now()+'@hockeymasterstrainer\r\n';
    ics += 'DTSTAMP:'+icsDate(new Date(),0,0)+'Z\r\n';
    ics += 'DTSTART:'+dtstart+'\r\n';
    ics += 'DURATION:PT45M\r\n';
    ics += 'RRULE:'+rrule+'\r\n';
    ics += 'SUMMARY:'+ev.name+' — Hockey Masters Trainer\r\n';
    ics += 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+ev.name+'\r\nTRIGGER:-PT0M\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hockey-masters-trainer-reminders.ics';
  a.click();
}
// Prefer the native Share Sheet (Web Share API with a file) over a plain download link. On iOS a plain
// download just lands in Safari's Downloads folder, which is easy to lose track of; the Share Sheet lets
// the user explicitly save to iCloud Drive, AirDrop it to another device, or email it — all genuinely
// durable, off-device destinations. Falls back to the old download-link behavior where Web Share isn't
// available (desktop browsers, older iOS).
async function exportData(){
  DATA.settings.lastExportAt = new Date().toISOString();
  save();
  const filename = 'hockey-fitness-tracker-backup-' + ymd(new Date()) + '.json';
  const jsonStr = JSON.stringify(DATA, null, 2);
  const blob = new Blob([jsonStr], {type:'application/json'});

  let canWebShare = false;
  try{
    canWebShare = !!(navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:'application/json'})]}));
  }catch(e){ canWebShare = false; }

  if(canWebShare){
    try{
      const file = new File([blob], filename, {type:'application/json'});
      await navigator.share({files:[file], title:'Hockey Tracker Backup'});
      renderToday();
      return;
    }catch(e){
      if(e && e.name==='AbortError'){ renderToday(); return; } // user cancelled the share sheet — respect that, don't force a download too
      // any other failure: fall through to the plain download below
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  renderToday();
}
function daysSinceLastExport(){
  const last = DATA.settings.lastExportAt;
  if(!last) return Infinity;
  return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
}
// Shown at the top of Today once backups are overdue. Data only lives on this one device — the risk
// isn't just Safari's storage-eviction policy (home-screen apps are largely exempt from that as long as
// you open them regularly) but the much more mundane one: a lost, broken, or reset phone. Either way,
// a backup you haven't taken can't save you.
function backupReminderBanner(){
  const days = daysSinceLastExport();
  if(days < 5) return '';
  const msg = days===Infinity
    ? "You haven't backed up yet. Everything you log lives only on this device."
    : `It's been ${days} days since your last backup. Everything you log lives only on this device.`;
  return `<div class="skip-banner" style="cursor:pointer" onclick="exportData()">
    <span>${msg}</span>
    <span style="text-decoration:underline;flex-shrink:0;margin-left:8px;white-space:nowrap">Back up now</span>
  </div>`;
}
function importData(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(e){ alert('Could not read that file — it may not be a valid backup.'); evt.target.value=''; return; }

    const countEntries = d => ['w1','w2','cardio','mobility','body','injury','skip','session','tests'].reduce((n,k)=> n + Object.keys(d[k]||{}).length, 0);
    const currentCount = countEntries(DATA);
    const incomingCount = countEntries(incoming);
    const importedAt = incoming.settings && incoming.settings.lastExportAt ? new Date(incoming.settings.lastExportAt).toLocaleString() : 'an unknown date';
    const proceed = confirm(
      `This will REPLACE all data currently on this device (${currentCount} logged entries) with the imported backup `+
      `(${incomingCount} entries, last exported ${importedAt}).\n\n`+
      `A safety copy of what's currently on this device will download automatically first, in case this was a mistake.\n\nContinue?`
    );
    if(!proceed){ evt.target.value=''; return; }

    // Safety net: snapshot whatever is currently on-device before overwriting it, so an accidental or
    // wrong-file import is always recoverable, not a second way to lose data.
    const safetyBlob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const sa = document.createElement('a');
    sa.href = URL.createObjectURL(safetyBlob);
    sa.download = 'hockey-tracker-PRE-IMPORT-safety-backup-' + ymd(new Date()) + '.json';
    sa.click();

    DATA = applyDefaults(incoming);
    migrateData();
    save(); renderToday();
    alert('Data imported. A backup of what was on this device just before the import was also downloaded, just in case.');
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function clearAll(){ DATA={w1:{},w2:{},cardio:{},mobility:{},body:{},injury:{},skip:{},settings:{},session:{},tests:{},schemaVersion:SCHEMA_VERSION}; save(); renderToday(); }

/* ================= INIT ================= */
renderToday();
renderReference();
// Offline fallback so the Home Screen icon still opens with no signal (e.g. at a field/gym). sw.js is a
// separate file — this registration is silently a no-op (caught, ignored) until sw.js is uploaded
// alongside this file, so it's safe to ship before that file exists on the server.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
