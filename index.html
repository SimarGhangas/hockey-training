:root{
  --bg:#0A0D12; --surface:#161B23; --surface2:#1D232C; --border:#262D38;
  --text:#F2F5F9; --text-dim:#94A0B1; --text-faint:#5C6675;
  --accent:#9C1C3B; --accent-dim:rgba(156,28,59,0.20); --accent-text:#FF6F85;
  --success:#22E584; --success-dim:rgba(34,229,132,0.16);
  --danger:#FF5468; --danger-dim:rgba(255,84,104,0.16);
  --warn:#FFB020; --warn-dim:rgba(255,176,32,0.16);
  --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:calc(70px + env(safe-area-inset-bottom)); -webkit-font-smoothing:antialiased;}
header{background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--border);}
header .brand{display:flex;align-items:center;gap:10px;}
header .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#FF6F45);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
header h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-0.01em;}
header .sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
main{padding:16px 16px 30px;max-width:600px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}
.daybar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);
  padding:10px 10px;margin-bottom:14px;border:1px solid var(--border);}
.daybar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);width:38px;height:38px;
  border-radius:var(--radius-sm);font-size:16px;font-weight:600;font-family:inherit;}
.daybar button:disabled{opacity:0.3;}
.daybar .center{text-align:center;flex:1;}
.daybar .center .d{font-size:15px;font-weight:700;}
.daybar .center .w{font-size:11.5px;color:var(--accent-text);font-weight:600;margin-top:1px;}
.jumprow{display:flex;gap:5px;justify-content:center;margin-top:6px;}
.jumprow select{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:11px;font-family:inherit;
  background:var(--surface2);color:var(--text-dim);color-scheme:dark;}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;color:var(--accent-text);
  text-transform:uppercase;letter-spacing:.02em;}
.card h3 .tag{font-size:10px;background:var(--surface2);color:var(--text-dim);padding:4px 9px;border-radius:20px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;}
/* Collapsible card pattern — every Today card except "This week" renders as <details class="card"> so it
   starts closed and the day's screen needs minimal scrolling to get an overview. The summary mirrors the
   old .card h3 styling (red, all-caps, tag pill on the right) so a collapsed card looks identical to the
   old always-open one, just closed by default. */
details.card{padding:0;}
details.card>summary{margin:0;padding:16px;font-size:14.5px;font-weight:700;display:flex;align-items:center;
  justify-content:space-between;color:var(--accent-text);text-transform:uppercase;letter-spacing:.02em;
  cursor:pointer;list-style:none;gap:8px;}
details.card>summary::-webkit-details-marker{display:none;}
details.card>summary::after{content:'\25B8';color:var(--text-dim);font-size:13px;flex-shrink:0;
  transition:transform .15s;text-transform:none;}
details.card[open]>summary::after{transform:rotate(90deg);}
details.card>summary .tag{text-transform:uppercase;}

// Groups a supplement stack's entries by their time label, preserving first-seen order — e.g. the three
// 7:30pm evening items collapse into one { time:'7:30pm', items:[...] } group instead of three separate
// ones, so the Supplements card can render one header per time slot instead of one per item.
function groupSupplementsByTime(stack){
  const order = []; const map = {};
  stack.forEach(item=>{
    if(!map[item.time]){ map[item.time] = []; order.push(item.time); }
    map[item.time].push(item);
  });
  return order.map(time=>({time, items:map[time]}));
}

/* ================= STORAGE ================= */
const STORE_KEY = "hockey_tracker_v3";
// NEVER bump STORE_KEY to migrate the schema — that orphans existing users' data under the old key
// (silently invisible, not technically deleted, but indistinguishable from data loss to the user).
// Instead bump SCHEMA_VERSION and add a migration step in migrateData() below.
const SCHEMA_VERSION = 4;
let DATA = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
function applyDefaults(d){
  d.w1 = d.w1 || {}; d.w2 = d.w2 || {}; d.cardio = d.cardio || {};
  d.mobility = d.mobility || {}; d.body = d.body || {}; d.injury = d.injury || {};
  d.skip = d.skip || {}; // "{week}_{dayIndex}": {skipped:true, reason:"Injured"} — genuine miss only (Rest/Injured/Ill/Busy/Other)
  d.activity = d.activity || {}; // "{week}_{dayIndex}": {calories, distance, hr, duration, opponent, result, done, notes} — for a day whose EFFECTIVE session is Football/Hockey Training/Hockey Match
  d.extra = d.extra || {}; // "{week}_{dayIndex}": {active, type, calories, distance, hr, duration, opponent, result, done, notes} — an ADDITIONAL Football/Hockey Training/Hockey Match on top of whatever's picked that day (e.g. cardio AM + training PM)
  d.dayPick = d.dayPick || {}; // "{week}_{dayIndex}": sessionTypeId | null — per-day override of the weekly schedule default; key absent = "use the default". Lets Simar pick freely day-to-day without editing the schedule.
  d.settings = d.settings || {}; // one-off values that don't change weekly, e.g. height for BMI
  if(!d.settings.weeklySchedule) d.settings.weeklySchedule = Object.assign({}, DEFAULT_SCHEDULE); // "{dayIndex}": sessionTypeId | null — the DEFAULT that dayPick can override per date
  d.session = d.session || {}; // "{w1|w2}_{week}": {rpe, duration} — whole-session RPE, separate from per-exercise w1/w2 rows
  d.tests = d.tests || {}; // "{1|6|12}": {sprint, cod, jump, run} — baseline/mid/final fitness benchmarks
  d.readiness = d.readiness || {}; // "{week}_{dayIndex}": {soreness, sleep, stress, motivation} each '1'-'5', higher = better/readier. Pre-session leading indicator, complements post-session RPE.
  d.supplements = d.supplements || {}; // "{week}_{dayIndex}": {"{itemId}":'Y'|'N'} — adherence checklist against the day-appropriate SUPPLEMENT_SCHEDULES stack. No dosage/medical logic here, purely a checklist mirror of the plan in Supplement_Schedule_Printable.docx.
  return d;
}
function migrateData(){
  // Runs on every load and after every import. If DATA predates schemaVersion tracking, it's
  // implicitly version 0 (unversioned) — add real migration steps here as `if(v < N){...}` blocks
  // whenever the schema changes in the future, then stamp schemaVersion = SCHEMA_VERSION at the end.
  const v = DATA.schemaVersion || 0;
  if(v < 1){ /* no migration needed yet — v1 is the current baseline schema */ }
  if(v < 2){
    // v2: the fixed Mon-Sun plan became a user-assignable weekly schedule, cardio rows moved from a
    // day-derived slot number to a type-keyed row, "Match" was renamed "Hockey Match", Football was
    // added, and Sleep was dropped entirely. None of that maps cleanly onto v1 data (the slot numbers
    // themselves change meaning), and this was explicitly requested as a clean restart for the new
    // 17 Aug 2026 start date — so v1 history is wiped rather than guessed at. Height (for BMI) is the
    // only setting worth carrying forward; everything else in settings is reset with it.
    const heightCm = DATA.settings ? DATA.settings.heightCm : undefined;
    DATA.w1 = {}; DATA.w2 = {}; DATA.cardio = {}; DATA.mobility = {};
    DATA.body = {}; DATA.injury = {}; DATA.skip = {}; DATA.activity = {};
    DATA.session = {}; DATA.tests = {};
    DATA.settings = { weeklySchedule: Object.assign({}, DEFAULT_SCHEDULE) };
    if(heightCm) DATA.settings.heightCm = heightCm;
  }
  if(v < 3){ /* no-op: dayPick is a purely additive bucket, applyDefaults() above already seeds it as {}
    for existing data — nothing needs to change shape or be wiped for this one. */ }
  if(v < 4){
    // v4: Football/Hockey Training/Hockey Match came OUT of the skip dropdown (the "Today's session"
    // picker above already covers picking one of them as the day's primary thing) and a new, separate
    // "Log an extra activity" mechanism (DATA.extra) replaces the old skip-toggle-as-additive-extra
    // behaviour. Any EXISTING skip records that still carry one of those three reasons (logged before
    // this update) are migrated forward into DATA.extra rather than silently dropped, so no historical
    // Football/Training/Match log is lost — the skip record itself is then cleared to a neutral state.
    Object.entries(DATA.skip).forEach(([dayKey, r])=>{
      if(!r || !r.skipped || !["Football","Hockey Training","Hockey Match"].includes(r.reason)) return;
      DATA.extra[dayKey] = { active:true, type:r.reason, calories:r.calories, distance:r.distance,
        hr:r.hr, duration:r.duration, opponent:r.opponent, result:r.result, done:'Y' };
      delete DATA.skip[dayKey];
    });
  }
  DATA.schemaVersion = SCHEMA_VERSION;
}
applyDefaults(DATA);
migrateData();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }

/* ================= TODAY VIEW ================= */
const MIN_DATE = startOfDay(START_DATE);
let currentDate = startOfDay(new Date()) < MIN_DATE ? MIN_DATE : startOfDay(new Date());

function weekInfoFor(date){
  const days = Math.round((startOfDay(date) - START_DATE) / 86400000);
  if(days >= WEEKS*7) return {inProgram:false};
  const week = Math.floor(days/7)+1;
  const dayIndex = days%7;
  return {inProgram:true, week, dayIndex, block:weekBlock(week), cycle:cycleOf(week)};
}
// What's scheduled on a given day of the week (0=Mon..6=Sun), per the user's own weekly schedule —
// replaces the old fixed CARDIO_BY_DAYINDEX/dayIndex===1||3 checks now that every day is reassignable.
function scheduledTypeFor(dayIndex){ return (DATA.settings.weeklySchedule||{})[dayIndex] || null; }
// The weekly schedule is just a DEFAULT — any specific date can be overridden via the "Today's session"
// picker without touching the schedule itself. DATA.dayPick holding the KEY (even with value null, i.e.
// explicitly picked "Rest") means an override exists for that date; the key being absent means "follow
// the default". This is what every day's actual rendering and all adherence/count math reads from.
function effectiveTypeFor(week, dayIndex){
  const dayKey = `${week}_${dayIndex}`;
  if(Object.prototype.hasOwnProperty.call(DATA.dayPick, dayKey)) return DATA.dayPick[dayKey];
  return scheduledTypeFor(dayIndex);
}
function setDayPick(week, dayIndex, val){
  const dayKey = `${week}_${dayIndex}`;
  if(val==='__default__'){ delete DATA.dayPick[dayKey]; }
  else { DATA.dayPick[dayKey] = val || null; }
  save();
  renderToday();
}

function fieldHtml(label, inputHtml){

}
function ynPills(k, row, f, val){

    <div class="pill y ${val==='Y'?'active':''}" onclick="setPill('${k}','${row}','${f}','Y',this)">Yes</div>
    <div class="pill n ${val==='N'?'active':''}" onclick="setPill('${k}','${row}','${f}','N',this)">No</div>

}
function setPill(k,row,f,val,el){
  DATA[k][row] = DATA[k][row] || {};

}
// 1-5 scale pills (readiness check) — same optimistic-DOM-update pattern as setPill above, deliberately
// NOT a full renderToday() re-render, so tapping a readiness score mid-session doesn't blow away a
// running rest/hold timer elsewhere on the page.
function scalePills(k, row, f, val){
  const opts = [1,2,3,4,5];
  return `<div class="pill-group">${opts.map(n=>`<div class="pill sel ${String(val)===String(n)?'active':''}" onclick="setScalePill('${k}','${row}','${f}',${n},this)">${n}</div>`).join('')}</div>`;
}
function setScalePill(k,row,f,val,el){
  DATA[k][row] = DATA[k][row] || {};
  const cur = DATA[k][row][f];
  DATA[k][row][f] = (String(cur)===String(val)) ? '' : String(val);
  save();
  const group = el.parentElement;
  group.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  if(DATA[k][row][f]) el.classList.add('active');
}
function bindField(el){
  const evt = (el.tagName==='TEXTAREA'||el.type==='number'||el.type==='text') ? 'input' : 'change';
  el.addEventListener(evt, ()=>{
    const {k,row,f,set} = el.dataset;
    if(!k||!row||!f) return;
    DATA[k][row] = DATA[k][row] || {};
    // data-set present = this field belongs to one set within a per-set sets[] array (strength/hold
    // exercises logging a different weight or hold-time per set) rather than a single row-level value.
    if(set!==undefined){
      DATA[k][row].sets = DATA[k][row].sets || [];
      const i = parseInt(set,10);
      DATA[k][row].sets[i] = DATA[k][row].sets[i] || {};
      DATA[k][row].sets[i][f] = el.value;
    } else {
      DATA[k][row][f] = el.value;
    }
    save();
  });
}
// Returns a `count`-length array to render set-row inputs from, WITHOUT writing anything to DATA — merely
// rendering/viewing a workout day must never itself create storage (that would make every unvisited day
// silently accumulate empty placeholder rows the moment you scroll past it, and would corrupt the "nothing
// logged yet" checks elsewhere, e.g. the schema-migration wipe test). Existing logged sets are read through
// as-is; missing slots are padded with a fresh {} for rendering only. The real DATA[key][rowKey].sets array
// only ever gets created lazily by bindField, at the moment a field is actually edited.
// Groups a workout's exercise list into swipeable carousel "pages": consecutive exercises sharing the same
// non-null superset id (e.g. "4A"/"4B" both tagged sup="4") land on ONE page together, since a superset is
// meant to be logged back-to-back without swiping away mid-set; anything with sup===null gets its own page.
// This is driven purely by the sup field already in WORKOUT1/2_EXERCISES, so it needs no hardcoded slot IDs
// and keeps working if the exercise list itself changes later.
function groupExercisesIntoPages(exercises){
  const pages = [];
  let i = 0;
  while(i < exercises.length){
    const sup = exercises[i][1];
    if(sup){
      const group = [exercises[i]];
      let j = i+1;
      while(j < exercises.length && exercises[j][1]===sup){ group.push(exercises[j]); j++; }
      pages.push(group);
      i = j;
    } else {
      pages.push([exercises[i]]);
      i++;
    }
  }
  return pages;
}
// Which carousel page each workout instance (keyed "{w1|w2}_{week}") is currently showing — tracked in
// memory only, same pattern as `openCards`. Swiping/tapping never triggers a full renderToday() re-render
// (that would kill any running rest/hold timer and re-collapse every other card), so this state persists
// across everything EXCEPT actually navigating to a different day/week, which naturally uses a different
// key and starts back at page 0 — matching "start your session from exercise 1" expectations.
let exercisePageIndex = {};
// The track is a flex row holding every page as a sibling. A flex row's own cross-axis (height) size is
// always driven by its TALLEST item regardless of align-items — typically a superset page stacking two full
// exercise blocks — so CSS alone can't express "only size to the currently-visible child." This measures the
// CURRENT page's real content height and applies it explicitly to the .excarousel wrapper (which clips via
// overflow:hidden), called on every navigation and once on initial render (from wireCarousels). This only
// works because .excarousel-track uses align-items:flex-start, not the flex default of stretch — stretch
// would inflate every page's own box to match the tallest sibling, which would corrupt the scrollHeight read
// below (a short page would report the tall page's height, since its own box had already been stretched to
// match) and silently defeat this whole function.
function resizeExCarousel(container){
  if(!container) return;
  const current = container.querySelector('.excarousel-page.current') || container.querySelector('.excarousel-page');
  if(!current) return;
  container.style.height = current.scrollHeight + 'px';
}
function exCarouselGo(posKey, newPage, pagesLen){
  newPage = Math.max(0, Math.min(pagesLen-1, newPage));
  exercisePageIndex[posKey] = newPage;
  const track = document.getElementById('excarousel-track-'+posKey);
  if(track) track.style.transform = 'translateX(-'+(newPage*100)+'%)';
  const container = document.getElementById('excarousel-'+posKey);
  if(!container) return;
  container.querySelectorAll('.excarousel-page').forEach((p,i)=>p.classList.toggle('current', i===newPage));
  container.querySelectorAll('.excarousel-dots .dot').forEach((d,i)=>d.classList.toggle('active', i===newPage));
  const btns = container.querySelectorAll('.excarousel-btn');
  if(btns[0]) btns[0].disabled = (newPage===0);
  if(btns[1]) btns[1].disabled = (newPage===pagesLen-1);
  resizeExCarousel(container);
}
// Prev/Next buttons call this with a fixed -1/+1 rather than baking in a target page number, so their
// onclick never needs rewriting after a navigation (they always mean "one from wherever we are now").
function exCarouselStep(posKey, delta, pagesLen){
  exCarouselGo(posKey, (exercisePageIndex[posKey]||0) + delta, pagesLen);
}
// Real swipe gesture support, layered on top of the same exCarouselGo/Step functions the Prev/Next buttons
// use — Pointer Events cover touch AND mouse/trackpad in one listener set, no separate touch-event code
// path needed. touch-action:pan-y on the track (set in CSS) tells the browser to leave vertical scrolling
// alone and let this handler own horizontal gestures instead of fighting over them.
function wireCarousels(container){
  container.querySelectorAll('.excarousel').forEach(el=>{
    resizeExCarousel(el);
    const posKey = el.dataset.key;
    const pagesLen = parseInt(el.dataset.pages, 10);
    let startX=null, startY=null, dragging=false, horizontal=false;
    el.addEventListener('pointerdown', e=>{ startX=e.clientX; startY=e.clientY; dragging=true; horizontal=false; });
    el.addEventListener('pointermove', e=>{
      if(!dragging || startX==null) return;
      if(Math.abs(e.clientX-startX) > Math.abs(e.clientY-startY)) horizontal = true;
    });
    el.addEventListener('pointerup', e=>{
      if(!dragging || startX==null){ dragging=false; return; }
      const dx = e.clientX-startX, dy = e.clientY-startY;
      dragging = false;
      if(horizontal && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
        exCarouselStep(posKey, dx < 0 ? 1 : -1, pagesLen);
      }
      startX = null; startY = null;
    });
    el.addEventListener('pointercancel', ()=>{ dragging=false; startX=null; });
  });
}
function getSetsForRender(key, rowKey, count){
  const existing = (DATA[key][rowKey] && DATA[key][rowKey].sets) || [];
  const out = [];
  for(let i=0;i<count;i++){ out[i] = existing[i] || {}; }
  return out;
}
function wireCard(container){
  container.querySelectorAll('input,select,textarea').forEach(bindField);
}
// Which Today cards are currently expanded, tracked in memory only (not persisted to DATA/localStorage —
// this is a pure UI convenience). Several actions (toggling skip/extra, changing today's session pick,
// changing day) call a full renderToday() re-render, which would otherwise silently re-collapse every
// card back to its default closed state on every interaction. Reading/writing this Set at render time and
// on every <details> toggle means a card the user just opened stays open across those re-renders.
// 'card-session' (the primary Strength/Cardio/Activity/Rest card — whatever's actually being logged that
// day) starts open by default, unlike every other card: it's the one thing you need on-screen the moment
// you open the app to log a session, so collapsing it by default would add a tap before you can start
// logging anything. Simar can still collapse it manually — that gets tracked and respected like any card.
let openCards = new Set(['card-session']);
function onCardToggle(id, isOpen){ if(isOpen) openCards.add(id); else openCards.delete(id); }
function cardOpenAttrs(id){ return `id="${id}" ${openCards.has(id)?'open':''} ontoggle="onCardToggle('${id}', this.open)"`; }

/* ================= REST TIMER + TIMED-HOLD STOPWATCH =================
 * Both are ephemeral (nothing persisted to DATA beyond the hold stopwatch auto-filling the existing
 * "Actual" field) and both use a TIMESTAMP-based countdown (endsAt/startedAt), not a decrementing counter
 * — that self-corrects against setInterval throttling/drift instead of accumulating error, and means a
 * renderToday() re-render mid-countdown (e.g. from saving an unrelated field) doesn't lose time: the same
 * button id gets recreated by the re-render, and the interval tick looks it up FRESH by id every second
 * rather than holding a stale element reference, so it just keeps updating the new node. */
function parseRestSeconds(str){
  const m = String(str||'').trim().match(/^(\d+)s$/);
  return m ? parseInt(m[1],10) : null;
}
function formatMMSS(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function playBeep(){
  // Foreground-only by nature (Web Audio needs an active tab) — fine for a rest/hold timer, since you're
  // holding the phone through the set, unlike a scheduled reminder that needs to fire while the app's closed.
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 880; osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
    osc.onended = () => ctx.close();
  }catch(e){}
}
// restTimer: { btnId, seconds, endsAt, pausedRemaining } | null. pausedRemaining is null while running;
// set to the frozen remaining-seconds value while paused (endsAt is stale/ignored while paused).
let restTimer = null;
let restTimerHandle = null;
// Renders the full control (either the initial "Start rest" button, or the running/paused two-button row)
// for a given rest-timer slot. Called on every state transition (start/pause/resume/reset/complete) to
// rebuild just that slot's wrapper — NOT on every 1s tick, which only patches the label text node so a
// running countdown doesn't rebuild the DOM (and lose focus/etc elsewhere) every second.
function restTimerHtml(btnId, seconds){
  const isThis = restTimer && restTimer.btnId===btnId;
  if(!isThis){
    return `<button type="button" class="timer-btn" id="${btnId}" onclick="startRestTimer(${seconds}, '${btnId}')">Start rest (${formatMMSS(seconds)})</button>`;
  }
  const paused = restTimer.pausedRemaining!=null;
  const remaining = paused ? restTimer.pausedRemaining : Math.max(0,(restTimer.endsAt-Date.now())/1000);
  return `<div class="timer-row">
    <button type="button" class="timer-btn active" id="${btnId}"><span id="${btnId}-lbl">${formatMMSS(remaining)}</span></button>
    <button type="button" class="timer-btn timer-pause" onclick="pauseResumeRestTimer('${btnId}')">${paused?'Resume':'Pause'}</button>
    <button type="button" class="timer-btn timer-reset" onclick="resetRestTimer('${btnId}')">Reset</button>
  </div>`;
}
function refreshRestWrap(btnId, seconds){
  const wrap = document.getElementById('wrap-'+btnId);
  if(wrap) wrap.innerHTML = restTimerHtml(btnId, seconds);
}
function startRestTimer(seconds, btnId){
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  restTimer = { btnId, seconds, endsAt: Date.now() + seconds*1000, pausedRemaining: null };
  refreshRestWrap(btnId, seconds);
  restTimerHandle = setInterval(()=>restTickTock(btnId), 1000);
}
function restTickTock(btnId){
  if(!restTimer || restTimer.btnId !== btnId || restTimer.pausedRemaining!=null){
    if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; } return;
  }
  const remaining = (restTimer.endsAt - Date.now())/1000;
  if(remaining <= 0){
    clearInterval(restTimerHandle); restTimerHandle=null;
    const seconds = restTimer.seconds; restTimer = null;
    refreshRestWrap(btnId, seconds);
    playBeep();
    return;
  }
  const lbl = document.getElementById(btnId+'-lbl');
  if(lbl) lbl.textContent = formatMMSS(remaining);
}
function pauseResumeRestTimer(btnId){
  if(!restTimer || restTimer.btnId !== btnId) return;
  if(restTimer.pausedRemaining==null){
    // Pause: freeze the remaining time and stop ticking.
    restTimer.pausedRemaining = Math.max(0, (restTimer.endsAt - Date.now())/1000);
    if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  } else {
    // Resume: recompute endsAt from the frozen remaining time and restart ticking.
    restTimer.endsAt = Date.now() + restTimer.pausedRemaining*1000;
    restTimer.pausedRemaining = null;
    restTimerHandle = setInterval(()=>restTickTock(btnId), 1000);
  }
  refreshRestWrap(btnId, restTimer.seconds);
}
function resetRestTimer(btnId){
  if(!restTimer || restTimer.btnId !== btnId) return;
  if(restTimerHandle){ clearInterval(restTimerHandle); restTimerHandle=null; }
  const seconds = restTimer.seconds; restTimer = null;
  refreshRestWrap(btnId, seconds);
}

// holdTimer: { rowKey, startedAt, pausedElapsed } | null. rowKey here is the COMPOSITE key
// "${exRowKey}_${setIndex}" so each set within an exercise gets its own independent stopwatch slot.
// pausedElapsed is null while running; set to the frozen elapsed-seconds value while paused.
let holdTimer = null;
let holdTimerHandle = null;
function holdElapsed(){
  if(!holdTimer) return 0;
  return holdTimer.pausedElapsed!=null ? holdTimer.pausedElapsed : (Date.now()-holdTimer.startedAt)/1000;
}
// rowKey here is always the PLAIN exercise row key (e.g. "1_3"), never the composite — every function in
// this group computes compositeKey = rowKey+"_"+setIndex internally from the same two plain inputs, so
// there's exactly one place per function that does the composing and no risk of a caller accidentally
// passing an already-composed key back in (which previously double-suffixed it, e.g. "1_3_0_0").
function holdTimerHtml(rowKey, key, setIndex){
  const compositeKey = rowKey+'_'+setIndex;
  const btnId = 'hold-btn-'+compositeKey;
  const isThis = holdTimer && holdTimer.rowKey===compositeKey;
  if(!isThis){
    return `<button type="button" class="timer-btn" id="${btnId}" onclick="toggleHoldTimer('${rowKey}','${key}',${setIndex})">Start</button>`;
  }
  const paused = holdTimer.pausedElapsed!=null;
  return `<div class="timer-row">
    <button type="button" class="timer-btn active" id="${btnId}" onclick="toggleHoldTimer('${rowKey}','${key}',${setIndex})">Stop (<span id="${btnId}-lbl">${formatMMSS(holdElapsed())}</span>)</button>
    <button type="button" class="timer-btn timer-pause" onclick="pauseResumeHoldTimer('${rowKey}','${key}',${setIndex})">${paused?'Resume':'Pause'}</button>
    <button type="button" class="timer-btn timer-reset" onclick="resetHoldTimer('${rowKey}','${key}',${setIndex})">Reset</button>
  </div>`;
}
function refreshHoldWrap(rowKey, key, setIndex){
  const compositeKey = rowKey+'_'+setIndex;
  const wrap = document.getElementById('wraphold-'+compositeKey);
  if(wrap) wrap.innerHTML = holdTimerHtml(rowKey, key, setIndex);
}
function holdTickTock(compositeKey){
  if(!holdTimer || holdTimer.rowKey !== compositeKey || holdTimer.pausedElapsed!=null){
    if(holdTimerHandle){ clearInterval(holdTimerHandle); holdTimerHandle=null; } return;
  }
  const lbl = document.getElementById('hold-btn-'+compositeKey+'-lbl');
  if(lbl) lbl.textContent = formatMMSS(holdElapsed());
}
function toggleHoldTimer(exRowKey, key, setIndex){
  const compositeKey = exRowKey+'_'+setIndex;
  if(holdTimer && holdTimer.rowKey === compositeKey){
    // Stop — commit the elapsed time into that set's "seconds" field via the normal data-k/row/set/f
    // wiring (dispatching input so bindField's save logic runs), the same structured path every other
    // set-level field uses, rather than a parallel storage mechanism just for timed holds.
    const elapsed = Math.round(holdElapsed());
    if(holdTimerHandle){ clearInterval(holdTimerHandle); holdTimerHandle=null; }
    holdTimer = null;
    const input = document.querySelector(`input[data-k="${key}"][data-row="${exRowKey}"][data-set="${setIndex}"][data-f="seconds"]`);
    if(input){ input.value = elapsed; input.dispatchEvent(new Event('input', {bubbles:true})); }
    refreshHoldWrap(exRowKey, key, setIndex);
  } else {
    if(holdTimerHandle){ clearInterval(holdTimerHandle); holdTimerHandle=null; }
    holdTimer = { rowKey: compositeKey, startedAt: Date.now(), pausedElapsed: null };
    refreshHoldWrap(exRowKey, key, setIndex);
    holdTimerHandle = setInterval(()=>holdTickTock(compositeKey), 1000);
  }
}
function pauseResumeHoldTimer(exRowKey, key, setIndex){
  const compositeKey = exRowKey+'_'+setIndex;
  if(!holdTimer || holdTimer.rowKey !== compositeKey) return;
  if(holdTimer.pausedElapsed==null){
    holdTimer.pausedElapsed = holdElapsed();
    if(holdTimerHandle){ clearInterval(holdTimerHandle); holdTimerHandle=null; }
  } else {
    holdTimer.startedAt = Date.now() - holdTimer.pausedElapsed*1000;
    holdTimer.pausedElapsed = null;
    holdTimerHandle = setInterval(()=>holdTickTock(compositeKey), 1000);
  }
  refreshHoldWrap(exRowKey, key, setIndex);
}
// Abandon the current attempt without writing anything to the set's field — distinct from Stop, which
// commits. Lets Simar bail out of a bad hold attempt and start the set over from 0.
function resetHoldTimer(exRowKey, key, setIndex){
  const compositeKey = exRowKey+'_'+setIndex;
  if(!holdTimer || holdTimer.rowKey !== compositeKey) return;
  if(holdTimerHandle){ clearInterval(holdTimerHandle); holdTimerHandle=null; }
  holdTimer = null;
  refreshHoldWrap(exRowKey, key, setIndex);
}

  const { week, dayIndex, block } = info;

  const skipRec = DATA.skip[dayKey] || {};

  html += `<details class="card" ${cardOpenAttrs('card-picker')}><summary><span class="sumtxt">Today's session</span><span class="tag">${todayType?esc(SESSION_LABEL[todayType]||todayType):'Rest'}</span></summary><div class="card-body">

        <div style="font-size:11px;color:var(--text-dim);margin:-4px 0 10px">${RPE_LEGEND}</div>
      ` : `

          ${fieldHtml('Active calories', `<input type="number" data-k="extra" data-row="${dayKey}" data-f="calories" value="${extraRec.calories??''}">`)}
          ${fieldHtml('Distance run (km)', `<input type="number" step="0.1" data-k="extra" data-row="${dayKey}" data-f="distance" value="${extraRec.distance??''}">`)}
        </div>

        ${fieldHtml('Distance (km)', `<input type="number" step="0.1" data-k="cardio" data-row="${rowKey}" data-f="dist" value="${rec.dist??''}">`)}
        ${fieldHtml('Time (min)', `<input type="number" data-k="cardio" data-row="${rowKey}" data-f="dur" value="${rec.dur??''}">`)}

    // — no toggle needed to "turn it on", same as strength/cardio days. Stored separately from DATA.skip

          entries.push({title:(extraRec.type||'Activity')+' (extra) — '+d, meta});

    if((historyFilter==='all'||historyFilter==='tests') && ['1','6','12'].includes(String(week))){

      if(t && (t.sprint||t.cod||t.jump||t.run)){

      }
    }
    if(historyFilter==='all'||historyFilter==='readiness'){
      DAY_NAMES.forEach((d,di)=>{
        const r = DATA.readiness[`${week}_${di}`];
        if(!r) return;
        const parts = [];
        if(r.soreness) parts.push('Soreness '+r.soreness);
        if(r.sleep) parts.push('Sleep '+r.sleep);
        if(r.stress) parts.push('Stress '+r.stress);
        if(r.motivation) parts.push('Motivation '+r.motivation);
        if(!parts.length) return;

    }
    if(historyFilter==='all'||historyFilter==='supplements'){
      DAY_NAMES.forEach((d,di)=>{
        const rec = DATA.supplements[`${week}_${di}`];

    if(!entries.length) continue;
    out += `<details class="hist-week"><summary>Week ${week} <span class="cnt">${entries.length} entries</span></summary>
      ${entries.map(e=>`<div class="hist-entry"><div class="hd">${esc(e.title)}</div><div class="meta">${esc(e.meta.trim()||'—')}</div></div>`).join('')}
    </details>`;
  }
  el.innerHTML = out || `<div class="note">No entries logged yet for this filter.</div>`;
}

/* ================= DASHBOARD ================= */
// A genuinely skipped session (Rest/Injured/Ill/Busy/Other — i.e. any SKIP_REASONS value, since skip is
// genuine-misses-only now) is excluded from both numerator and denominator — it's not a missed session,
// it was a deliberate call, so it shouldn't drag adherence % down. An extra Football/Hockey Training/
// Hockey Match (DATA.extra) is different: it's additive (you may have ALSO done the programmed session
// that day), so it must NOT be excluded the same way — otherwise a real cardio/strength "done=Y" saved
// on a day you also logged an extra silently drops out of the adherence math. If you logged an extra
// INSTEAD of the programmed session (no exercises/cardio actually marked done that day), it auto-credits
// as completed, per the "counts as completed" design.
function countDone(obj, field){ let d=0; Object.values(obj).forEach(r=>{ if(r && r[field]==='Y') d++; }); return d; }
function isGenuineSkip(week, dayIndex){ const r = DATA.skip[`${week}_${dayIndex}`]; return !!(r && r.skipped); }
// Substitution credit is deliberately scoped to the three team-activity types (Football/Hockey Training/
// Hockey Match) only — a real match or training session plausibly stands in for a missed programmed day.
// A cardio/Walk extra (EXTRA_CARDIO_TYPES) must NOT trigger this: a short recovery walk auto-crediting a
// missed heavy strength day would quietly flatter the adherence numbers. Confirmed with Simar before
// building this — cardio/walk extras are purely additive, never a substitute.
function isActivityLogged(week, dayIndex){
  const r = DATA.extra[`${week}_${dayIndex}`];
  return !!(r && r.active && ACTIVITY_REASONS.includes(r.type));
}
// Every day can be freely overridden (see effectiveTypeFor), so a session type is no longer pinned to
// one fixed day of the week — it can move around, appear on a different day some weeks, or not appear
// at all if overridden away. Adherence is measured against whichever day (if any) EFFECTIVELY carried
// that type each week, not a fixed slot. For w1/w2/cardio — each meant to happen once a week per the
// program — only the first matching day in a week counts, so an accidental double-assignment within the
// same week doesn't double the denominator.
function firstDayEachWeekFor(type){
  const hits = [];
  for(let week=1; week<=WEEKS; week++){
    for(let dayIndex=0; dayIndex<7; dayIndex++){
      if(effectiveTypeFor(week, dayIndex)===type){ hits.push({week, dayIndex}); break; }
    }
  }
  return hits;
}
function strengthAdherence(key){
  let done=0, total=0;
  const exList = key==='w1' ? WORKOUT1_EXERCISES : WORKOUT2_EXERCISES;
  const exCount = exList.length;
  firstDayEachWeekFor(key).forEach(({week,dayIndex})=>{
    if(isGenuineSkip(week, dayIndex)) return;
    total += exCount;
    let dayDone = 0;
    exList.forEach(ex=>{ const rec = DATA[key][`${week}_${ex[0]}`]; if(rec && rec.done==='Y') dayDone++; });
    done += (dayDone===0 && isActivityLogged(week, dayIndex)) ? exCount : dayDone;
  });
  return {done, total};
}
function cardioAdherence(){
  let done=0, total=0;
  CARDIO_TYPES.forEach(type=>{
    firstDayEachWeekFor(type).forEach(({week,dayIndex})=>{
      if(isGenuineSkip(week, dayIndex)) return;
      total++;
      const rec = DATA.cardio[`${week}_${type}`];
      const realDone = !!(rec && rec.done==='Y');
      if(realDone || isActivityLogged(week, dayIndex)) done++;
    });
  });
  return {done, total};
}
// Counts completions of a Football/Hockey Training/Hockey Match type across the whole program: every
// day whose EFFECTIVE pick is that type (there can be more than one in a week, unlike w1/w2/cardio —
// e.g. two football sessions) with a completed DATA.activity record, PLUS any DATA.extra entries of
// that type logged on top of a DIFFERENT day's pick. A day can't be both at once (the primary form and
// the extra-activity card write to different buckets), so no double-counting guard is needed here.
function activityCount(type){
  let count = 0;
  for(let week=1; week<=WEEKS; week++){
    for(let dayIndex=0; dayIndex<7; dayIndex++){
      const dayKey = `${week}_${dayIndex}`;
      if(effectiveTypeFor(week, dayIndex)===type){
        const rec = DATA.activity[dayKey];
        if(rec && rec.done==='Y') count++;
      }
      const extraRec = DATA.extra[dayKey];
      if(extraRec && extraRec.active && extraRec.type===type && extraRec.done==='Y') count++;
    }
  }
  return count;
}
// A type's weekly target: 1 if it's currently in the default schedule (once-a-week for w1/w2/cardio,
// and Football/Hockey Training/Hockey Match get a target too if the user has chosen to schedule them by
// default), else 0 — meaning it's shown as an uncapped extra rather than "x/0".
function weeklyTarget(type){ return Object.values(DATA.settings.weeklySchedule||{}).includes(type) ? 1 : 0; }
// How much of each session type actually happened in a given week, resetting naturally every week since
// it's computed fresh from that week's data rather than stored as a running counter.
function weeklyTypeCounts(week){
  const counts = {};
  SCHEDULABLE_TYPES.forEach(t=>{ counts[t.id]=0; });
  ['w1','w2'].forEach(key=>{
    const exList = key==='w1' ? WORKOUT1_EXERCISES : WORKOUT2_EXERCISES;
    const any = exList.some(ex=>{ const rec=DATA[key][`${week}_${ex[0]}`]; return rec && rec.done==='Y'; });
    if(any) counts[key] = 1;
  });
  CARDIO_TYPES.forEach(type=>{ const rec=DATA.cardio[`${week}_${type}`]; if(rec && rec.done==='Y') counts[type] = 1; });
  for(let dayIndex=0; dayIndex<7; dayIndex++){
    const dayKey = `${week}_${dayIndex}`;
    const type = effectiveTypeFor(week, dayIndex);
    if(type && ACTIVITY_REASONS.includes(type)){
      const rec = DATA.activity[dayKey];
      if(rec && rec.done==='Y') counts[type]++;
    }
    const extraRec = DATA.extra[dayKey];
    if(extraRec && extraRec.active && extraRec.type && extraRec.done==='Y') counts[extraRec.type]++;
  }
  return counts;
}
// Overall "X/Y core sessions this week" — Y is however many distinct types are in the default schedule
// right now (normally 5: Steady/W1/Sprint-COD/W2/Interval), X is how many of those have at least one
// completion logged this week. Bonus extras (Football etc, if not in the default) don't inflate Y.
function weeklyProgress(week){
  const counts = weeklyTypeCounts(week);
  const coreTypes = Object.values(DATA.settings.weeklySchedule||{}).filter(Boolean);
  const target = coreTypes.length;
  const done = coreTypes.filter(t=>counts[t]>0).length;
  return {counts, coreTypes, done, target};
}
// Unlike strengthAdherence/cardioAdherence (which measure how well you stuck to the PROGRAMMED plan
// and exclude activities as neutral), this is a plain running total of every completed training
// instance — a completed strength day, a completed cardio day, a football session, a hockey training
// session, or a match. Deliberately NOT scored against a fixed number of days: you won't train or play
// every day, so a "X/84" denominator would just read as a shortfall.
// Single source of truth for the activity mix — used by activeTrainingDays() (the "Total training days
// logged" stat) and the end-of-dashboard pie chart, so the two can never drift out of sync with each other.
function trainingBreakdown(){
  const strengthDays = new Set(), cardioDays = new Set();
  Object.entries(DATA.w1).forEach(([k,r])=>{ if(r && r.done==='Y') strengthDays.add('w1_'+k.split('_')[0]); });
  Object.entries(DATA.w2).forEach(([k,r])=>{ if(r && r.done==='Y') strengthDays.add('w2_'+k.split('_')[0]); });
  Object.entries(DATA.cardio).forEach(([k,r])=>{ if(r && r.done==='Y') cardioDays.add(k); });
  return {
    strength: strengthDays.size,
    cardio: cardioDays.size,
    football: activityCount('Football'),
    training: activityCount('Hockey Training'),
    match: activityCount('Hockey Match'),
    // Extra Steady/Sprint-COD/Interval/Walk sessions logged via the "Log an extra activity" card — summed
    // separately from `cardio` above rather than folded into it, because `cardio` specifically measures
    // adherence to the ONE programmed cardio day/week; merging the two would conflate "stuck to the plan"
    // with "did more than the plan" and make the Cardio-done stat impossible to read honestly.
    extraCardio: EXTRA_CARDIO_TYPES.reduce((sum,t)=>sum+activityCount(t),0),
  };
}
function activeTrainingDays(){
  const b = trainingBreakdown();
  return b.strength + b.cardio + b.football + b.training + b.match + b.extraCardio;
}
// One status per calendar day, for the streak/heatmap view. 'done' beats 'skip' beats 'missed' — a
// genuinely skipped day (Rest/Injured/Ill/Busy/Other) is deliberately NOT treated the same as a silent
// miss, mirroring how the adherence math elsewhere already excludes real skips rather than penalizing them.
function dayStatus(week, dayIndex){
  const dayKey = `${week}_${dayIndex}`;
  const type = effectiveTypeFor(week, dayIndex);
  let done = false;
  if(type==='w1' || type==='w2'){
    const exList = type==='w1' ? WORKOUT1_EXERCISES : WORKOUT2_EXERCISES;
    done = exList.some(ex=>{ const rec = DATA[type][`${week}_${ex[0]}`]; return rec && rec.done==='Y'; });
  } else if(CARDIO_TYPES.includes(type)){
    const rec = DATA.cardio[`${week}_${type}`];
    done = !!(rec && rec.done==='Y');
  } else if(type && ACTIVITY_REASONS.includes(type)){
    const rec = DATA.activity[dayKey];
    done = !!(rec && rec.done==='Y');
  }
  const extraRec = DATA.extra[dayKey];
  if(extraRec && extraRec.active && extraRec.done==='Y') done = true;
  if(done) return 'done';
  if(isGenuineSkip(week, dayIndex)) return 'skip';
  const date = addDays(START_DATE, (week-1)*7 + dayIndex);
  if(startOfDay(date) > startOfDay(new Date())) return 'future';
  return 'missed';
}
// Consecutive days, walking backward from today, that are NOT 'missed' — a genuine skip preserves the
// streak (same philosophy as dayStatus above), only a silent miss breaks it. Today itself is never allowed
// to BREAK the streak just because it isn't logged yet (the day isn't over) — it's simply skipped past.
function currentStreak(){
  const today = startOfDay(new Date());
  if(today < MIN_DATE) return 0;
  const progEnd = addDays(START_DATE, WEEKS*7-1);
  let cursor = today > progEnd ? progEnd : today;
  let streak = 0, isFirst = true;
  while(cursor >= MIN_DATE){
    const info = weekInfoFor(cursor);
    if(!info.inProgram) break;
    const status = dayStatus(info.week, info.dayIndex);
    if(status==='missed'){
      if(isFirst && ymd(cursor)===ymd(today)){ /* today, not logged yet — don't count it, don't break on it */ }
      else break;
    } else {
      streak++;
    }
    isFirst = false;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function renderHeatmapGrid(){
  const cellColor = { done:'var(--success)', skip:'var(--surface2)', missed:'var(--danger-dim)', future:'transparent' };
  let html = '<div class="heatmap">';
  for(let week=1; week<=WEEKS; week++){
    html += `<div class="heatmap-row"><div class="heatmap-wk">W${week}</div>`;
    for(let dayIndex=0; dayIndex<7; dayIndex++){
      const status = dayStatus(week, dayIndex);
      html += `<div class="heatmap-cell" style="background:${cellColor[status]}" title="${DAY_NAMES[dayIndex]} Wk${week}: ${status}"></div>`;
    }
    html += `</div>`;
  }
  return html + '</div>';
}
// Average of the day's own 4 scores (all higher-is-better), averaged again across every day that week
// with at least one readiness field logged — a day with only 2 of the 4 fields filled still counts,
// scored on what was actually answered rather than being thrown out.
function weeklyReadinessAvg(week){
  let sum=0, days=0;
  for(let dayIndex=0; dayIndex<7; dayIndex++){
    const r = DATA.readiness[`${week}_${dayIndex}`];
    if(!r) continue;
    const vals = ['soreness','sleep','stress','motivation'].map(f=>r[f]).filter(v=>v!==undefined && v!=='').map(Number);
    if(vals.length===0) continue;
    sum += vals.reduce((a,b)=>a+b,0)/vals.length;
    days++;
  }
  return days>0 ? sum/days : null;
}
function weeklyCardioDistance(week){
  let total=0,count=0;
  CARDIO_TYPES.forEach(type=>{ const rec=DATA.cardio[`${week}_${type}`]; if(rec){ if(rec.dist) total+=parseFloat(rec.dist)||0; if(rec.done==='Y') count++; } });
  return {total,count};
}
function setHeight(val){ DATA.settings.heightCm = val; save(); renderDashboard(); }
// BMI from the latest logged bodyweight and a one-off height you enter once (stored in
// DATA.settings.heightCm). Standard BMI cutoffs are population-level and don't account for muscle
// mass — for someone doing heavy strength work, a "high" BMI may just mean more muscle, not more fat.
// Shown with that caveat rather than as a clean pass/fail number.
function currentBMI(){
  const heightCm = parseFloat(DATA.settings.heightCm);
  if(!heightCm || heightCm<=0) return null;
  let latestWeight=null;
  for(let w=WEEKS; w>=1; w--){
    const r = DATA.body[String(w)];
    if(r && r.weight!==undefined && r.weight!==''){ latestWeight = parseFloat(r.weight); break; }
  }
  if(latestWeight==null || isNaN(latestWeight)) return null;
  const heightM = heightCm/100;
  const bmi = latestWeight/(heightM*heightM);
  const category = bmi<18.5?'Underweight' : bmi<25?'Normal' : bmi<30?'Overweight' : 'Obese';
  return { bmi, category };
}
// Detects exercises whose target is a timed hold (e.g. "20s", "16s e.s") rather than a rep count
// (e.g. "10-12", "12 e.s") — Epley 1RM estimation is meaningless for an isometric hold, so those get
// charted as raw weight instead. Checked against the Wk1-2 target only, since an exercise's fundamental
// nature (timed vs rep-based) doesn't change across blocks, only the numbers do.
function repsAreTimeBased(repsStr){ return /^\d+s(\s|$)/.test(String(repsStr).trim()); }

function strengthExerciseList(){
  const build = (key, group, list) => list.map(ex=>{
    const [slot,sup,gymEx,gymLink,homeEx,homeLink,t12,t34,t56] = ex;
    return { key, slot, group, label:`${gymEx} / ${homeEx}`, timeBased: repsAreTimeBased(t12[1]),
      targets:{ "Wk1-2":t12, "Wk3-4":t34, "Wk5-6":t56 } };
  });
  return [...build('w1','Workout 1',WORKOUT1_EXERCISES), ...build('w2','Workout 2',WORKOUT2_EXERCISES)];
}
function exerciseInfo(key, slot){ return strengthExerciseList().find(e=>e.key===key && e.slot===slot); }
// One-line summary of a logged exercise row for the History list — reads the per-set sets[] array (each
// set's weight+reps, or seconds for a timed hold) when present, falling back to the old single
// actual/weight fields for rows logged before per-set tracking existed so past history doesn't go blank.
function summarizeSetsMeta(key, slot, rec){
  const info = exerciseInfo(key, slot);
  const timeBased = info ? info.timeBased : false;
  if(rec && Array.isArray(rec.sets) && rec.sets.length){
    const vals = rec.sets.map(s=>{
      if(!s) return null;
      if(timeBased) return (s.seconds!=null && s.seconds!=='') ? s.seconds+'s' : null;
      return (s.weight!=null && s.weight!=='') ? s.weight+'kg'+(s.reps!=null&&s.reps!==''?'×'+s.reps:'') : null;
    }).filter(Boolean);
    if(vals.length) return vals.join(', ');
  }
  return `${rec&&rec.actual||''} ${rec&&rec.weight?rec.weight+'kg':''}`.trim();
}
// Best value across a row's logged sets, for progression-chart/PR purposes: the heaviest set (by
// estimated 1RM for weighted exercises, by raw seconds held for timed holds), NOT an average or the last
// set — Simar may deliberately load sets differently (e.g. ramping weight up across a set), so the
// meaningful "how strong was I this week" number is the best single set, same logic a real strength
// coach would use for a session's top set. Falls back to the legacy single weight field for rows logged
// before per-set tracking existed, so historical PR/chart data isn't lost by this change.
function bestSetValue(key, slot, week, rec, info){
  const block = weekBlock(week);
  const blockTargetReps = String((info.targets[block]||[])[1]||'');
  const repsMatch = blockTargetReps.match(/\d+/);
  const blockReps = repsMatch ? parseFloat(repsMatch[0]) : null;
  if(rec && Array.isArray(rec.sets) && rec.sets.length){
    const vals = rec.sets.map(s=>{
      if(!s) return null;
      if(info.timeBased){
        const sec = parseFloat(s.seconds);
        return isNaN(sec) ? null : sec;
      }
      const weight = parseFloat(s.weight);
      if(isNaN(weight)) return null;
      const repsMatch2 = String(s.reps==null?'':s.reps).match(/\d+/);
      const reps = repsMatch2 ? parseFloat(repsMatch2[0]) : blockReps;
      return reps ? weight * (1 + reps/30) : weight;
    }).filter(v=>v!=null);
    if(vals.length) return Math.max(...vals);
  }
  // Legacy fallback: a row logged before per-set tracking used a single weight field directly.
  if(rec && rec.weight!==undefined && rec.weight!==''){
    const weight = parseFloat(rec.weight);
    if(isNaN(weight)) return null;
    if(info.timeBased) return weight;
    return blockReps ? weight * (1 + blockReps/30) : weight;
  }
  return null;
}

// Estimated 1RM uses the WEEK'S PRESCRIBED reps as a fallback when a set's own reps weren't logged (the
// old freeform "Actual (sets x reps)" text field this superseded was unstructured and unreliable to
// parse); per-set reps, when logged, are used directly since they're now real structured data.
function strengthProgressionSeries(key, slot){
  const info = exerciseInfo(key, slot);
  if(!info) return { values:[], timeBased:false, label:'' };
  const weeks = Array.from({length:WEEKS},(_,i)=>i+1);
  const values = weeks.map(week=>{
    const rec = DATA[key][`${week}_${slot}`];
    return bestSetValue(key, slot, week, rec, info);
  });
  return { values, timeBased: info.timeBased, label: info.label };
}
// A "PR" here means this week's estimated 1RM (or raw weight, for a timed hold) beats every OTHER week
// logged for this exact exercise slot — strictly greater than, not just tied with itself. The very first
// entry for an exercise is deliberately NOT flagged: there's nothing to have beaten yet, so calling it a
// "record" would be a trivial/meaningless badge on day one.
function isNewPRThisWeek(key, slot, week){
  const { values } = strengthProgressionSeries(key, slot);
  const cur = values[week-1];
  if(cur==null) return false;
  const priorOther = values.filter((v,i)=>i!==(week-1) && v!=null);
  if(priorOther.length===0) return false;
  return cur > Math.max(...priorOther);
}

// Weekly training load = session RPE x session duration (mins), summed across every session logged
// that week (Workout 1, Workout 2, and all three cardio slots) — the standard Foster sRPE method. Lets
// load spikes show up even when raw RPE looks flat: a short brutal session and a long moderate one can
// report the same RPE but represent very different strain on the body.
function weeklyTrainingLoad(week){
  let load = 0, any = false;
  ['w1','w2'].forEach(key=>{
    const r = DATA.session[`${key}_${week}`];
    if(r && r.rpe!==undefined && r.rpe!=='' && r.duration){ load += (parseFloat(r.rpe)||0) * (parseFloat(r.duration)||0); any = true; }
  });
  CARDIO_TYPES.forEach(type=>{
    const r = DATA.cardio[`${week}_${type}`];
    if(r && r.rpe!==undefined && r.rpe!=='' && r.dur){ load += (parseFloat(r.rpe)||0) * (parseFloat(r.dur)||0); any = true; }
  });
  return any ? load : null; // null (not 0) when nothing logged, so the chart shows a gap rather than a false zero
}
// Approximated ACWR (acute:chronic workload ratio) — the standard sports-science version uses true
// rolling 7-day/28-day windows, but this app's training load is bucketed per CALENDAR WEEK, not per day,
// so a genuine rolling window isn't available without a much bigger data-model change. This week's load
// divided by the average of the last (up to) 4 weeks is a reasonable weekly-granularity stand-in for the
// same idea, deliberately NOT presented as clinical-grade — the 0.8-1.3 "typical range" / >1.5 "elevated"
// bands are the commonly-cited IOC-consensus figures, though more recent research questions how well ACWR
// actually predicts injury. Treat this as a nudge to look closer, not a rule.
function workloadRatio(week){
  const thisLoad = weeklyTrainingLoad(week);
  if(thisLoad==null) return null;
  const priorLoads = [];
  for(let w=Math.max(1,week-4); w<week; w++){
    const l = weeklyTrainingLoad(w);
    if(l!=null) priorLoads.push(l);
  }
  if(priorLoads.length===0) return null;
  const avg = priorLoads.reduce((a,b)=>a+b,0)/priorLoads.length;
  if(avg===0) return null;
  return { ratio: thisLoad/avg, thisLoad, avg, weeksUsed: priorLoads.length };
}
function workloadRatioNote(r){
  if(!r) return '';
  const pct = (r.ratio*100).toFixed(0);
  let msg, color;
  if(r.ratio > 1.5){ msg = `This week's load is ${pct}% of your last ${r.weeksUsed}-week average — a bigger jump than the research flags as typically fine. Worth backing off if anything feels off.`; color='var(--danger)'; }
  else if(r.ratio > 1.3){ msg = `This week's load is ${pct}% of your last ${r.weeksUsed}-week average — a bit above the typical range. Keep an eye on it.`; color='var(--warn)'; }
  else if(r.ratio < 0.8){ msg = `This week's load is ${pct}% of your last ${r.weeksUsed}-week average — lighter than usual (could be planned recovery, or a sign you're doing less than you think).`; color='var(--text-dim)'; }
  else { msg = `This week's load is ${pct}% of your last ${r.weeksUsed}-week average — in your typical range.`; color='var(--success)'; }
  return `<div style="font-size:11.5px;color:${color};margin-top:6px">${msg}</div>`;
}

// Change from the Week 1 baseline test to the latest test logged (Week 6 if present, else Week 12).
// higherIsBetter distinguishes sprint/COD (lower=faster=better) from jump/run (higher=further=better).
function testDelta(field, higherIsBetter){
  const w1 = DATA.tests['1'];
  const w1v = w1 && w1[field]!==undefined && w1[field]!=='' ? parseFloat(w1[field]) : null;
  let latestWeek=null, latestV=null;
  ['12','6'].forEach(w=>{
    if(latestV!=null) return;
    const r = DATA.tests[w];
    if(r && r[field]!==undefined && r[field]!==''){ latestWeek=w; latestV=parseFloat(r[field]); }
  });
  if(w1v==null || latestV==null || latestWeek==='1') return null;
  const delta = latestV - w1v;
  const improved = higherIsBetter ? delta>0 : delta<0;
  return { delta, latestWeek, improved };
}
function testFieldRow(label, field, unit, protocol){
  return `<div class="field"><label>${esc(label)} (${unit})</label>
    <div style="font-size:11px;color:var(--text-faint);margin:-2px 0 6px">${esc(protocol)}</div>
    <div class="row3">
      ${['1','6','12'].map(w=>`<input type="number" step="0.1" placeholder="Wk${w}" data-k="tests" data-row="${w}" data-f="${field}" value="${(DATA.tests[w]&&DATA.tests[w][field]!==undefined)?DATA.tests[w][field]:''}">`).join('')}
    </div></div>`;
}
function testDeltaHtml(field, unit, higherIsBetter){
  const d = testDelta(field, higherIsBetter);
  if(!d) return '';
  const color = d.improved ? 'var(--success)' : 'var(--danger)';
  return `<div style="font-size:11.5px;color:${color};margin:-4px 0 12px">Wk1 &rarr; Wk${d.latestWeek}: ${d.delta>0?'+':''}${d.delta.toFixed(2)}${unit} &mdash; ${d.improved?'improved':'declined'}</div>`;
}

// ROOT CAUSE of the "charts don't fit their boxes" bug: setting canvas.width/canvas.height (the
// bitmap-resolution attributes) with no matching CSS size pins the DISPLAYED box to those attribute
// values too, once devicePixelRatio > 1 (any Retina iPhone/iPad, dpr=2 or 3) that inflates the visible
// card to 2-3x the intended height/width — exactly what the screenshot showed (tiny plot crammed into
// the top of a huge card). Fix: explicitly lock canvas.style.width/height to the logical CSS size, and
// only use the *2 (not *dpr) buffer for text sharpness — separate from anything used for user-facing math.
function drawLineChart(canvasId, weeks, values, color){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 32 || 280; // card content width minus its own padding
  const h = 90;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const nums = values.filter(v=>v!=null&&!isNaN(v)&&v!==0);
  if(nums.length===0){
    ctx.fillStyle='#5C6675'; ctx.font='11px Barlow'; ctx.textAlign='center';
    ctx.fillText('No data logged yet', w/2, h/2+4);
    ctx.textAlign='left';
    return;
  }

  const padL=30,padR=8,padT=8,padB=16;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const rawMax = Math.max(...nums);
  const maxV = rawMax*1.15 || 1;
  // Pick label precision from the data's own scale so small values (e.g. sleep hours) don't all round to
  // the same integer — that was producing duplicate "1, 1, 0" axis labels when nothing had been logged yet.
  const decimals = maxV < 3 ? 1 : maxV < 15 ? 1 : 0;
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.font='8px Barlow'; ctx.fillStyle='#5C6675';
  for(let i=0;i<=2;i++){ const y=padT+plotH-(plotH*i/2); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); ctx.fillText((maxV*i/2).toFixed(decimals),2,y+3); }
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); let started=false;
  values.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const x=padL+plotW*(i/(weeks.length-1)); const y=padT+plotH-(plotH*(v/(maxV||1))); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle=color;
  values.forEach((v,i)=>{ if(v==null||isNaN(v)) return; const x=padL+plotW*(i/(weeks.length-1)); const y=padT+plotH-(plotH*(v/(maxV||1))); ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); });
  // X-axis: always anchor the first and last week so the chart visibly spans the full 12-week program,
  // plus a couple of markers in between.
  ctx.fillStyle='#5C6675'; ctx.font='8px Barlow';
  const lastIdx = weeks.length-1;
  weeks.forEach((wk,i)=>{
    if(i!==0 && i!==lastIdx && wk%3!==1) return;
    const x=padL+plotW*(i/lastIdx);
    const align = i===0 ? 0 : i===lastIdx ? -14 : -6;
    ctx.fillText('W'+wk, x+align, h-3);
  });
}
// Simple custom pie chart (consistent with drawLineChart — no external chart library). Renders arcs
// plus an HTML legend with percentages underneath, since reading exact values off a bare pie is unreliable.
function drawPieChart(canvasId, legendId, segments){
  const canvas = document.getElementById(canvasId); if(!canvas) return;
  const legendEl = document.getElementById(legendId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 180;
  canvas.style.width = size+'px'; canvas.style.height = size+'px';
  canvas.width = Math.round(size*dpr); canvas.height = Math.round(size*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);

  const total = segments.reduce((a,s)=>a+s.value,0);
  const cx=size/2, cy=size/2, r=size/2-4;
  if(total===0){
    ctx.fillStyle='#5C6675'; ctx.font='11px Barlow'; ctx.textAlign='center';
    ctx.fillText('No activity logged yet', cx, cy+4);
    ctx.textAlign='left';
    if(legendEl) legendEl.innerHTML = '';
    return;
  }
  let start = -Math.PI/2;
  segments.forEach(s=>{
    if(s.value<=0) return;
    const slice = (s.value/total) * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+slice); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    start += slice;
  });
  ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';

  if(legendEl){
    legendEl.innerHTML = segments.map(s=>{
      const pct = total ? Math.round(s.value/total*100) : 0;
      return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0">
        <div style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0"></div>
        <div style="flex:1;color:var(--text-dim)">${esc(s.label)}</div>
        <div style="font-weight:700">${s.value} <span style="color:var(--text-faint);font-weight:400">(${pct}%)</span></div>
      </div>`;
    }).join('');
  }
}

// Enforces "each session type lives on at most one day" — picking a type for a new day silently clears
// it from wherever it used to be, so the schedule can never end up scheduling the same session twice.
function setScheduleDay(dayIndex, type){
  const sched = DATA.settings.weeklySchedule;
  if(type){ Object.keys(sched).forEach(d=>{ if(Number(d)!==dayIndex && sched[d]===type) sched[d]=null; }); }
  sched[dayIndex] = type || null;
  save();
  renderReference();
  renderToday(); // Today's form depends on the schedule too
}

  <h3 style="font-size:14px;margin:18px 0 8px">Data</h3>
  <div class="toolbar">

  this browser's storage, nowhere else. "Export backup" opens your device's share sheet: choose "Save to Files" and pick iCloud
  Drive (not just "On My iPhone") so the backup survives a lost or reset phone, not just a full one. You'll get a reminder banner

// Clears the service worker's cache AND unregisters it, then reloads. Unregistering (not just clearing
// caches) matters: on next load the browser re-fetches sw.js itself from the network and re-runs
// install/activate from scratch, which is what actually guarantees the freshest index.html — clearing
// caches alone can still leave a stale service worker script running. Never touches localStorage/DATA,
// so this can't lose logged data, only cached app files.
async function forceRefresh(){
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){} // best-effort — if the Cache/SW APIs aren't available or throw, still fall through to reload
  // ROOT CAUSE of "Refresh app" not actually picking up a new upload: location.reload() re-requests the
  // exact same URL. On iOS, a home-screen "Add to Home Screen" app runs in a standalone WKWebView that
  // keeps its own navigation-level cache for that URL, separate from (and not cleared by) the Cache
  // Storage API or service-worker unregistration above — so reload() could still hand back the stale
  // document even once sw.js's own cache is genuinely empty. That's why only deleting and re-adding the
  // Home Screen icon (which forces a fresh Safari tab, a different cache context) ever actually worked.
  // Fix: navigate to a cache-busted URL instead of reloading the same one — a changing query string makes
  // this a genuinely different request the stale cache has no entry for, so it can't be served from it.
  location.replace(cacheBustedReloadUrl());
}
// Split out as its own pure function (no side effect) so the URL-construction logic can be unit tested
// directly, rather than needing to stub the actual browser navigation call.
function cacheBustedReloadUrl(){ return location.pathname + '?refresh=' + Date.now() + location.hash; }
// Prefer the native Share Sheet (Web Share API with a file) over a plain download link. On iOS a plain
// download just lands in Safari's Downloads folder, which is easy to lose track of; the Share Sheet lets
// the user explicitly save to iCloud Drive, AirDrop it to another device, or email it — all genuinely
// durable, off-device destinations. Falls back to the old download-link behavior where Web Share isn't
// available (desktop browsers, older iOS).
async function exportData(){
  DATA.settings.lastExportAt = new Date().toISOString();
  save();
  const filename = 'hockey-fitness-tracker-backup-' + ymd(new Date()) + '.json';
  const jsonStr = JSON.stringify(DATA, null, 2);
  const blob = new Blob([jsonStr], {type:'application/json'});

  let canWebShare = false;
  try{
    canWebShare = !!(navigator.canShare && navigator.canShare({files:[new File([blob], filename, {type:'application/json'})]}));
  }catch(e){ canWebShare = false; }

  if(canWebShare){
    try{
      const file = new File([blob], filename, {type:'application/json'});
      await navigator.share({files:[file], title:'Hockey Tracker Backup'});
      renderToday();
      return;
    }catch(e){
      if(e && e.name==='AbortError'){ renderToday(); return; } // user cancelled the share sheet — respect that, don't force a download too
      // any other failure: fall through to the plain download below
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  renderToday();
}
function daysSinceLastExport(){
  const last = DATA.settings.lastExportAt;
  if(!last) return Infinity;
  return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
}
// Shown at the top of Today once backups are overdue. Data only lives on this one device — the risk
// isn't just Safari's storage-eviction policy (home-screen apps are largely exempt from that as long as
// you open them regularly) but the much more mundane one: a lost, broken, or reset phone. Either way,
// a backup you haven't taken can't save you.
function backupReminderBanner(){
  const days = daysSinceLastExport();
  if(days < 5) return '';
  const msg = days===Infinity
    ? "You haven't backed up yet. Everything you log lives only on this device."
    : `It's been ${days} days since your last backup. Everything you log lives only on this device.`;
  return `<div class="skip-banner" style="cursor:pointer" onclick="exportData()">
    <span>${msg}</span>
    <span style="text-decoration:underline;flex-shrink:0;margin-left:8px;white-space:nowrap">Back up now</span>
  </div>`;
}
function importData(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(e){ alert('Could not read that file — it may not be a valid backup.'); evt.target.value=''; return; }

    const countEntries = d => ['w1','w2','cardio','mobility','body','injury','skip','activity','extra','dayPick','session','tests','readiness','supplements'].reduce((n,k)=> n + Object.keys(d[k]||{}).length, 0);
    const currentCount = countEntries(DATA);
    const incomingCount = countEntries(incoming);
    const importedAt = incoming.settings && incoming.settings.lastExportAt ? new Date(incoming.settings.lastExportAt).toLocaleString() : 'an unknown date';
    const proceed = confirm(
      `This will REPLACE all data currently on this device (${currentCount} logged entries) with the imported backup `+
      `(${incomingCount} entries, last exported ${importedAt}).\n\n`+
      `A safety copy of what's currently on this device will download automatically first, in case this was a mistake.\n\nContinue?`
    );
    if(!proceed){ evt.target.value=''; return; }

    // Safety net: snapshot whatever is currently on-device before overwriting it, so an accidental or
    // wrong-file import is always recoverable, not a second way to lose data.
    const safetyBlob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
    const sa = document.createElement('a');
    sa.href = URL.createObjectURL(safetyBlob);
    sa.download = 'hockey-tracker-PRE-IMPORT-safety-backup-' + ymd(new Date()) + '.json';
    sa.click();

    DATA = applyDefaults(incoming);
    migrateData();
    save(); renderToday();
    alert('Data imported. A backup of what was on this device just before the import was also downloaded, just in case.');
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function clearAll(){ DATA={w1:{},w2:{},cardio:{},mobility:{},body:{},injury:{},skip:{},activity:{},extra:{},dayPick:{},settings:{weeklySchedule:Object.assign({},DEFAULT_SCHEDULE)},session:{},tests:{},readiness:{},supplements:{},schemaVersion:SCHEMA_VERSION}; save(); renderToday(); renderReference(); }

renderToday();

// Offline fallback so the Home Screen icon still opens with no signal (e.g. at a field/gym). sw.js is a
// separate file — this registration is silently a no-op (caught, ignored) until sw.js is uploaded
// alongside this file, so it's safe to ship before that file exists on the server.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
// Recompute carousel heights on viewport resize (device rotation, or the mobile browser's URL bar
// collapsing/expanding) since content can reflow to a different height at a different width. Debounced —
// resize fires continuously while dragging/rotating, and re-measuring every .excarousel on every single
// event would be wasteful.
let resizeExTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeExTimer);
  resizeExTimer = setTimeout(()=>{
    document.querySelectorAll('.excarousel').forEach(resizeExCarousel);
  }, 150);
});
